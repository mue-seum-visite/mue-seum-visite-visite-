<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUE.SÉUM - Accueil</title>
  <!-- PAGE DE GARDE ACCUEIL - MUE.SÉUM -->
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .title {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 1px;
      margin: 0;
    }
    .title span {
      color: #d4af37; /* Couleur dorée pour SÉUM */
    }
    .subtitle {
      font-size: 0.8rem;
      color: #a0a0a0;
      letter-spacing: 2px;
      margin-top: 5px;
    }
    .search-bar {
      margin: 20px 0;
    }
    .search-input {
      width: 100%;
      padding: 12px 20px;
      border-radius: 25px;
      border: 1px solid #333;
      background-color: #1e1e1e;
      color: #fff;
      font-size: 1rem;
      box-sizing: border-box;
      outline: none;
    }
    .search-input:focus {
      border-color: #d4af37;
    }
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .btn-shuffle {
      background-color: #d4af37;
      color: #000;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
    }
    .route-card {
      background-color: #1e1e1e;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 15px;
      border: 1px solid #2a2a2a;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .route-card:hover {
      border-color: #d4af37;
    }
    .card-title {
      font-size: 1.2rem;
      font-weight: bold;
      margin: 0 0 6px 0;
      color: #ffffff;
    }
    .card-details {
      color: #aaa;
      font-size: 0.9rem;
    }
    .no-result {
      text-align: center;
      color: #777;
      margin-top: 30px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1 class="title">MUE.<span>SÉUM</span></h1>
    <div class="subtitle">L'ÉCHO DES TOILES</div>
  </div>

  <div class="search-bar">
    <input type="text" id="search-input" class="search-input" placeholder="Rechercher villes, parcours..." oninput="filtrerParcours()">
  </div>

  <div class="controls">
    <span>Itinéraires</span>
    <button class="btn-shuffle" onclick="permuterParcours()">🔀 Permuter l'ordre</button>
  </div>

  <div id="container-parcours"></div>

  <script>
    // Liste des parcours
    let parcoursData = [
      { id: 1, titre: "Promenade des Marchaux", lieu: "Châtelet, Hainaut", dur: "2h 34min", dist: "10,6 km" },
      { id: 2, titre: "Sentier de l'Ourthe", lieu: "Province de Liège", dur: "1h 45min", dist: "7,2 km" },
      { id: 3, titre: "Cap Gris-Nez", lieu: "Audinghen, France", dur: "33min", dist: "2,3 km" }
    ];

    function afficherParcours(liste) {
      const container = document.getElementById('container-parcours');
      container.innerHTML = '';

      if (liste.length === 0) {
        container.innerHTML = '<div class="no-result">Aucun parcours ne correspond à votre recherche.</div>';
        return;
      }

      liste.forEach(item => {
        container.innerHTML += `
          <div class="route-card">
            <div class="card-title">${item.titre}</div>
            <div class="card-details">${item.lieu} • ${item.dist} • ${item.dur}</div>
          </div>
        `;
      });
    }

    function filtrerParcours() {
      const recherche = document.getElementById('search-input').value.toLowerCase();
      const resultats = parcoursData.filter(item => 
        item.titre.toLowerCase().includes(recherche) || 
        item.lieu.toLowerCase().includes(recherche)
      );
      afficherParcours(resultats);
    }

    function permuterParcours() {
      parcoursData.push(parcoursData.shift()); // Décale le premier élément à la fin
      filtrerParcours(); // Maintient la recherche active même après permutation
    }

    // Affichage initial au chargement
    afficherParcours(parcoursData);
  </script>

</body>
</html>
