<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUE.SÉUM - Accueil</title>
  
  <!-- Compteur de visites GoatCounter -->
  <script data-goatcounter="https://mue-seum.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>

  <!-- PAGE DE GARDE ACCUEIL - MUE.SÉUM -->
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
      position: relative;
    }
    .title {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 1px;
      margin: 0;
    }
    .title span {
      color: #d4af37; /* Couleur dorée pour SÉUM */
    }
    .subtitle {
      font-size: 0.8rem;
      color: #a0a0a0;
      letter-spacing: 2px;
      margin-top: 5px;
    }
    .search-bar {
      margin: 20px 0;
    }
    .search-input {
      width: 100%;
      padding: 12px 20px;
      border-radius: 25px;
      border: 1px solid #333;
      background-color: #1e1e1e;
      color: #fff;
      font-size: 1rem;
      box-sizing: border-box;
      outline: none;
    }
    .search-input:focus {
      border-color: #d4af37;
    }
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .btn-shuffle {
      background-color: #d4af37;
      color: #000;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
    }
    .route-card {
      background-color: #1e1e1e;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 15px;
      border: 1px solid #2a2a2a;
      display: block;
      color: inherit;
      transition: border-color 0.2s;
    }
    .route-card:hover {
      border-color: #d4af37;
    }
    .card-title {
      font-size: 1.2rem;
      font-weight: bold;
      margin: 0 0 6px 0;
      color: #ffffff;
    }
    .card-img {
      width: 100%;
      max-height: 200px;
      object-fit: cover;
      border-radius: 8px;
      margin: 10px 0;
      border: 1px solid #333;
    }
    .card-details {
      color: #aaa;
      font-size: 0.9rem;
      margin-bottom: 10px;
    }
    .btn-gps, .btn-discover {
      display: block;
      text-align: center;
      background-color: #d4af37;
      color: #000;
      text-decoration: none;
      padding: 10px 0;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.9rem;
      margin-top: 10px;
    }
    .btn-discover {
      background-color: #ffffff;
      color: #000000;
    }
    .no-result {
      text-align: center;
      color: #777;
      margin-top: 30px;
    }

    /* --- STYLES DES INFOBULLES LÉGÈRES STYLE DESSIN ANIMÉ / BD --- */
    .btn-help-icon {
      position: absolute;
      right: 0;
      top: 5px;
      background: #2a2a2a;
      border: 1px solid #d4af37;
      color: #d4af37;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      font-weight: bold;
      cursor: pointer;
    }
    
    .onboarding-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.35);
      z-index: 9999;
      display: none;
      pointer-events: none;
    }

    /* La petite bulle BD ultra-fluide */
    .comic-bubble {
      position: absolute;
      background: #1e1e1e;
      border: 2px solid #d4af37;
      border-radius: 18px;
      padding: 12px 16px;
      width: calc(100% - 40px);
      max-width: 290px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.8), 0 0 10px rgba(212, 175, 55, 0.3);
      z-index: 10001;
      pointer-events: auto;
      box-sizing: border-box;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Pointe de bulle BD (Flèche) */
    .comic-bubble::after {
      content: '';
      position: absolute;
      width: 0;
      height: 0;
      border-style: solid;
    }
    
    /* Flèche pointant vers le bas */
    .comic-bubble.arrow-bottom::after {
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 10px 10px 0 10px;
      border-color: #d4af37 transparent transparent transparent;
    }

    /* Flèche pointant vers le haut */
    .comic-bubble.arrow-top::after {
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 0 10px 10px 10px;
      border-color: transparent transparent #d4af37 transparent;
    }

    .bubble-badge {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #d4af37;
      font-weight: bold;
      margin-bottom: 2px;
    }
    .bubble-title {
      font-size: 0.95rem;
      font-weight: bold;
      margin-bottom: 4px;
      color: #ffffff;
    }
    .bubble-text {
      font-size: 0.8rem;
      color: #dddddd;
      line-height: 1.3;
      margin-bottom: 10px;
    }
    .bubble-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-skip {
      background: transparent;
      border: none;
      color: #888888;
      font-size: 0.75rem;
      cursor: pointer;
      text-decoration: underline;
    }
    .btn-next {
      background: #d4af37;
      color: #000;
      border: none;
      padding: 5px 12px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 0.78rem;
      cursor: pointer;
    }

    /* SURBRILLANCE ROUGE COMPACTE DE L'ÉLÉMENT CIBLÉ */
    .highlight-guide {
      position: relative !important;
      z-index: 10000 !important;
      outline: 3px solid #ff2a2a !important;
      outline-offset: 3px !important;
      box-shadow: 0 0 12px rgba(255, 42, 42, 0.7) !important;
      transition: all 0.2s ease-in-out;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1 class="title">MUE.<span>SÉUM</span></h1>
    <div class="subtitle">Machine à remonter le temps</div>
    <button class="btn-help-icon" onclick="demarrerAide(true)" title="Revoir le guide">?</button>
  </div>

  <div class="search-bar">
    <input type="text" id="search-input" class="search-input" placeholder="Rechercher villes, parcours..." oninput="filtrerParcours()">
  </div>

  <div class="controls">
    <span>Itinéraires</span>
    <button class="btn-shuffle" onclick="permuterParcours()">🔀 Permuter l'ordre</button>
  </div>

  <div id="container-parcours"></div>

  <!-- OVERLAY + BULLE BD -->
  <div id="onboarding-overlay" class="onboarding-overlay">
    <div id="comic-bubble" class="comic-bubble arrow-top">
      <div id="bubble-badge" class="bubble-badge">Étape 1 / 3</div>
      <div id="bubble-title" class="bubble-title">Titre</div>
      <div id="bubble-text" class="bubble-text">Texte explicatif...</div>
      <div class="bubble-actions">
        <button class="btn-skip" onclick="fermerAide()">Passer</button>
        <button id="btn-next-step" class="btn-next" onclick="etapeSuivante()">Suivant</button>
      </div>
    </div>
  </div>

  <script>
    let parcoursData = [];

    // Génération automatique des noms de fichiers de parcours-1.json à parcours-60.json
    const listeFichiers = Array.from({ length: 60 }, (_, i) => `parcours-${i + 1}.json`);

    // Chargement dynamique de chaque fichier individuel s'il existe
    Promise.all(
      listeFichiers.map(fichier => 
        fetch(fichier)
          .then(res => res.ok ? res.json() : null)
          .catch(() => null)
      )
    ).then(resultats => {
      // Filtrer pour garder uniquement les parcours réellement créés
      parcoursData = resultats.filter(item => item !== null);
      afficherParcours(parcoursData);

      // Lancement automatique instantané à la première visite
      if (!localStorage.getItem('mueseum_accueil_guided_seen')) {
        demarrerAide(false);
      }
    });

    function afficherParcours(liste) {
      const container = document.getElementById('container-parcours');
      container.innerHTML = '';

      if (liste.length === 0) {
        container.innerHTML = '<div class="no-result">Aucun parcours ne correspond à votre recherche.</div>';
        return;
      }

      liste.forEach(item => {
        container.innerHTML += `
          <div class="route-card">
            <div class="card-title">${item.titre}</div>
            ${item.image ? `<img src="${item.image}" class="card-img" alt="">` : ''}
            <div class="card-details">${item.lieu} • ${item.dist} • ${item.dur}</div>
            ${item.gps ? `<a href="${item.gps}" target="_blank" class="btn-gps">📍 Me rendre à la balade</a>` : ''}
            <a href="vue-parcours.html?id=${item.id}" class="btn-discover">🗺️ Découvrir ce parcours</a>
          </div>
        `;
      });
    }

    function filtrerParcours() {
      const recherche = document.getElementById('search-input').value.toLowerCase();
      const resultats = parcoursData.filter(item => 
        item.titre.toLowerCase().includes(recherche) || 
        item.lieu.toLowerCase().includes(recherche)
      );
      afficherParcours(resultats);
    }

    function permuterParcours() {
      if (parcoursData.length > 0) {
        parcoursData.push(parcoursData.shift());
        filtrerParcours();
      }
    }

    // --- GESTION DU GUIDE INFOBULLE BD ---
    let etapeActuelle = 0;
    const etapesGuide = [
      {
        badge: "Étape 1 / 3",
        title: "Explorez votre choix 🗺️",
        text: "MUE.SÉUM marche <b>sur place OU au chaud chez vous</b> ! Choisissez votre parcours.",
        targetClass: "route-card"
      },
      {
        badge: "Étape 2 / 3",
        title: "Sur le terrain 📍",
        text: "Pour aller au départ, ce bouton lance votre trajet GPS.",
        targetClass: "btn-gps"
      },
      {
        badge: "Étape 3 / 3",
        title: "C'est parti ! 🥾",
        text: "Sur place ou chez vous, cliquez ici pour lancer la carte interactive !",
        targetClass: "btn-discover"
      }
    ];

    function demarrerAide(force) {
      if (force) localStorage.removeItem('mueseum_accueil_guided_seen');
      etapeActuelle = 0;
      afficherEtapeGuide();
      document.getElementById('onboarding-overlay').style.display = 'block';
    }

    function afficherEtapeGuide() {
      document.querySelectorAll('.highlight-guide').forEach(el => el.classList.remove('highlight-guide'));

      const config = etapesGuide[etapeActuelle];
      document.getElementById('bubble-badge').innerText = config.badge;
      document.getElementById('bubble-title').innerText = config.title;
      document.getElementById('bubble-text').innerHTML = config.text;

      const btnNext = document.getElementById('btn-next-step');
      btnNext.innerText = (etapeActuelle === etapesGuide.length - 1) ? "OK !" : "Suivant";

      const elTarget = document.querySelector('.' + config.targetClass);
      if (elTarget) {
        elTarget.classList.add('highlight-guide');
        elTarget.scrollIntoView({ behavior: 'smooth', block: 'center' });

        // Calcul exact de la position de la bulle BD
        setTimeout(() => {
          const rect = elTarget.getBoundingClientRect();
          const bubble = document.getElementById('comic-bubble');
          
          // Horizontale (Centrée sur l'écran)
          let leftPos = (window.innerWidth - bubble.offsetWidth) / 2;
          bubble.style.left = leftPos + 'px';

          // Verticale (Positionnée en haut ou en bas avec pointeur)
          if (rect.top > 160) {
            // Placer AU DESSUS de l'élément cible
            bubble.style.top = (rect.top + window.scrollY - bubble.offsetHeight - 12) + 'px';
            bubble.className = "comic-bubble arrow-bottom";
          } else {
            // Placer EN DESSOUS de l'élément cible
            bubble.style.top = (rect.bottom + window.scrollY + 12) + 'px';
            bubble.className = "comic-bubble arrow-top";
          }
        }, 300);
      }
    }

    function etapeSuivante() {
      if (etapeActuelle < etapesGuide.length - 1) {
        etapeActuelle++;
        afficherEtapeGuide();
      } else {
        fermerAide();
      }
    }

    function fermerAide() {
      document.querySelectorAll('.highlight-guide').forEach(el => el.classList.remove('highlight-guide'));
      document.getElementById('onboarding-overlay').style.display = 'none';
      localStorage.setItem('mueseum_accueil_guided_seen', 'true');
    }

    window.addEventListener('resize', () => {
      if (document.getElementById('onboarding-overlay').style.display === 'block') {
        afficherEtapeGuide();
      }
    });
  </script>

</body>
</html>
