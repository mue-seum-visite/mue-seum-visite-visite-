<!DOCTYPE html> 
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUE.SÉUM - Accueil</title>
  
  <!-- Compteur de visites GoatCounter -->
  <script data-goatcounter="https://mue-seum.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>

  <!-- PAGE DE GARDE ACCUEIL - MUE.SÉUM -->
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
      position: relative;
    }
    .title {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 1px;
      margin: 0;
    }
    .title span {
      color: #d4af37; /* Couleur dorée pour SÉUM */
    }
    .subtitle {
      font-size: 0.8rem;
      color: #a0a0a0;
      letter-spacing: 2px;
      margin-top: 5px;
    }
    .search-bar {
      margin: 20px 0;
    }
    .search-input {
      width: 100%;
      padding: 12px 20px;
      border-radius: 25px;
      border: 1px solid #333;
      background-color: #1e1e1e;
      color: #fff;
      font-size: 1rem;
      box-sizing: border-box;
      outline: none;
    }
    .search-input:focus {
      border-color: #d4af37;
    }
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .btn-shuffle {
      background-color: #d4af37;
      color: #000;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
    }
    .route-card {
      background-color: #1e1e1e;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 15px;
      border: 1px solid #2a2a2a;
      display: block;
      color: inherit;
      transition: border-color 0.2s;
    }
    .route-card:hover {
      border-color: #d4af37;
    }
    .card-title {
      font-size: 1.2rem;
      font-weight: bold;
      margin: 0 0 6px 0;
      color: #ffffff;
    }
    .card-img {
      width: 100%;
      max-height: 200px;
      object-fit: cover;
      border-radius: 8px;
      margin: 10px 0;
      border: 1px solid #333;
    }
    .card-details {
      color: #aaa;
      font-size: 0.9rem;
      margin-bottom: 10px;
    }
    .btn-gps, .btn-discover {
      display: block;
      text-align: center;
      background-color: #d4af37;
      color: #000;
      text-decoration: none;
      padding: 10px 0;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.9rem;
      margin-top: 10px;
    }
    .btn-discover {
      background-color: #ffffff;
      color: #000000;
    }
    .no-result {
      text-align: center;
      color: #777;
      margin-top: 30px;
    }

    /* --- STYLES CAPSULE INTRO / CARROUSEL D'ONBOARDING --- */
    .btn-help-icon {
      position: absolute;
      right: 0;
      top: 5px;
      background: #2a2a2a;
      border: 1px solid #d4af37;
      color: #d4af37;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      font-weight: bold;
      cursor: pointer;
      z-index: 10;
    }

    .intro-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 99999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .intro-overlay.active {
      display: flex;
      opacity: 1;
    }

    .intro-card {
      background: #1e1e1e;
      border: 2px solid #d4af37;
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.9);
      text-align: center;
      position: relative;
    }

    .intro-icon {
      font-size: 2.8rem;
      margin-bottom: 12px;
      display: inline-block;
    }

    .intro-badge {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #d4af37;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .intro-title {
      font-size: 1.25rem;
      font-weight: 800;
      margin-bottom: 10px;
      color: #ffffff;
    }

    .intro-text {
      font-size: 0.9rem;
      color: #cccccc;
      line-height: 1.45;
      margin-bottom: 20px;
      min-height: 65px;
    }

    /* Indicateurs de progression (petits points) */
    .intro-dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 20px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #444;
      transition: all 0.3s ease;
    }
    .dot.active {
      background: #d4af37;
      width: 20px;
      border-radius: 10px;
    }

    .intro-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-intro-skip {
      background: transparent;
      border: none;
      color: #888;
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: underline;
    }

    .btn-intro-next {
      background: #d4af37;
      color: #000;
      border: none;
      padding: 10px 22px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1 class="title">MUE.<span>SÉUM</span></h1>
    <div class="subtitle">Machine à remonter le temps</div>
    <button class="btn-help-icon" onclick="demarrerAide(true)" title="Revoir le guide">?</button>
  </div>

  <div class="search-bar">
    <input type="text" id="search-input" class="search-input" placeholder="Rechercher villes, parcours..." oninput="filtrerParcours()">
  </div>

  <div class="controls">
    <span>Itinéraires</span>
    <button class="btn-shuffle" onclick="permuterParcours()">🔀 Permuter l'ordre</button>
  </div>

  <div id="container-parcours"></div>

  <!-- OVERLAY CARROUSEL D'INTRODUCTION AUTOMATIQUE -->
  <div id="intro-overlay" class="intro-overlay">
    <div class="intro-card">
      <div id="intro-icon" class="intro-icon">🗺️</div>
      <div id="intro-badge" class="intro-badge">Étape 1 / 3</div>
      <div id="intro-title" class="intro-title">Bienvenue sur MUE.SÉUM</div>
      <div id="intro-text" class="intro-text">Texte explicatif...</div>

      <div class="intro-dots">
        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>

      <div class="intro-actions">
        <button class="btn-intro-skip" onclick="fermerAide()">Accéder au site</button>
        <button id="btn-intro-next" class="btn-intro-next" onclick="etapeSuivante()">Suivant</button>
      </div>
    </div>
  </div>

  <script>
    let parcoursData = [];

    // Génération automatique des noms de fichiers de parcours-1.json à parcours-60.json
    const listeFichiers = Array.from({ length: 60 }, (_, i) => `parcours-${i + 1}.json`);

    // Chargement dynamique de chaque fichier individuel s'il existe
    Promise.all(
      listeFichiers.map(fichier => 
        fetch(fichier)
          .then(res => res.ok ? res.json() : null)
          .catch(() => null)
      )
    ).then(resultats => {
      // Filtrer pour garder uniquement les parcours réellement créés
      parcoursData = resultats.filter(item => item !== null);
      afficherParcours(parcoursData);

      // Lancement automatique du guide à la première visite
      if (!localStorage.getItem('mueseum_accueil_guided_seen')) {
        demarrerAide(false);
      }
    });

    function afficherParcours(liste) {
      const container = document.getElementById('container-parcours');
      container.innerHTML = '';

      if (liste.length === 0) {
        container.innerHTML = '<div class="no-result">Aucun parcours ne correspond à votre recherche.</div>';
        return;
      }

      liste.forEach(item => {
        container.innerHTML += `
          <div class="route-card">
            <div class="card-title">${item.titre}</div>
            ${item.image ? `<img src="${item.image}" class="card-img" alt="">` : ''}
            <div class="card-details">${item.lieu} • ${item.dist} • ${item.dur}</div>
            ${item.gps ? `<a href="${item.gps}" target="_blank" class="btn-gps">📍 Me rendre à la balade</a>` : ''}
            <a href="vue-parcours.html?id=${item.id}" class="btn-discover">🗺️ Découvrir ce parcours</a>
          </div>
        `;
      });
    }

    function filtrerParcours() {
      const recherche = document.getElementById('search-input').value.toLowerCase();
      const resultats = parcoursData.filter(item => 
        item.titre.toLowerCase().includes(recherche) || 
        item.lieu.toLowerCase().includes(recherche)
      );
      afficherParcours(resultats);
    }

    function permuterParcours() {
      if (parcoursData.length > 0) {
        parcoursData.push(parcoursData.shift());
        filtrerParcours();
      }
    }

    // --- CAPSULE D'INTRODUCTION AUTOMATIQUE EN 3 ÉTAPES ---
    let etapeActuelle = 0;
    let timerAutoNext = null;

    const etapesIntro = [
      {
        icon: "🗺️",
        badge: "Étape 1 / 3 — Bienvenue",
        title: "Explorez à votre rythme",
        text: "MUE.SÉUM s'utilise <b>sur le terrain OU directement depuis chez vous</b> ! Choisissez simplement la balade de votre choix."
      },
      {
        icon: "📍",
        badge: "Étape 2 / 3 — Sur le terrain",
        title: "Bouton « Me rendre à la balade »",
        text: "Vous souhaitez vous rendre sur place ? Ce bouton ouvre votre GPS (Waze, Google Maps...) pour vous guider jusqu'au point de départ exact."
      },
      {
        icon: "🥾",
        badge: "Étape 3 / 3 — Immersion",
        title: "Bouton « Découvrir ce parcours »",
        text: "Que vous soyez <b>sur le terrain ou confortablement installé chez vous</b>, cliquez dessus pour ouvrir la carte interactive !"
      }
    ];

    function demarrerAide(force) {
      if (force) localStorage.removeItem('mueseum_accueil_guided_seen');
      etapeActuelle = 0;
      afficherEtapeIntro();
      
      const overlay = document.getElementById('intro-overlay');
      overlay.classList.add('active');
      
      // Réinitialiser et lancer le défilement automatique toutes les 4.5 secondes
      lancerAutoDefilement();
    }

    function afficherEtapeIntro() {
      const config = etapesIntro[etapeActuelle];
      document.getElementById('intro-icon').innerText = config.icon;
      document.getElementById('intro-badge').innerText = config.badge;
      document.getElementById('intro-title').innerText = config.title;
      document.getElementById('intro-text').innerHTML = config.text;

      // Mise à jour des points de progression
      const dots = document.querySelectorAll('.dot');
      dots.forEach((dot, index) => {
        dot.classList.toggle('active', index === etapeActuelle);
      });

      const btnNext = document.getElementById('btn-intro-next');
      btnNext.innerText = (etapeActuelle === etapesIntro.length - 1) ? "C'est parti !" : "Suivant";
    }

    function etapeSuivante() {
      if (etapeActuelle < etapesIntro.length - 1) {
        etapeActuelle++;
        afficherEtapeIntro();
        lancerAutoDefilement(); // Relance le timer lors d'un clic manuel
      } else {
        fermerAide();
      }
    }

    function lancerAutoDefilement() {
      clearTimeout(timerAutoNext);
      timerAutoNext = setTimeout(() => {
        if (etapeActuelle < etapesIntro.length - 1) {
          etapeSuivante();
        }
      }, 4500); // 4.5 secondes par diapo
    }

    function fermerAide() {
      clearTimeout(timerAutoNext);
      const overlay = document.getElementById('intro-overlay');
      overlay.classList.remove('active');
      localStorage.setItem('mueseum_accueil_guided_seen', 'true');
    }
  </script>

</body>
</html>
