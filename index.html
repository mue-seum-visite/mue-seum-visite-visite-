<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUE.SÉUM - Accueil</title>
  
  <!-- Compteur de visites GoatCounter -->
  <script data-goatcounter="https://mue-seum.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>

  <!-- PAGE DE GARDE ACCUEIL - MUE.SÉUM -->
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
      position: relative;
    }
    .title {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 1px;
      margin: 0;
    }
    .title span {
      color: #d4af37; /* Couleur dorée pour SÉUM */
    }
    .subtitle {
      font-size: 0.8rem;
      color: #a0a0a0;
      letter-spacing: 2px;
      margin-top: 5px;
    }
    .search-bar {
      margin: 20px 0;
    }
    .search-input {
      width: 100%;
      padding: 12px 20px;
      border-radius: 25px;
      border: 1px solid #333;
      background-color: #1e1e1e;
      color: #fff;
      font-size: 1rem;
      box-sizing: border-box;
      outline: none;
    }
    .search-input:focus {
      border-color: #d4af37;
    }
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .btn-shuffle {
      background-color: #d4af37;
      color: #000;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
    }
    .route-card {
      background-color: #1e1e1e;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 15px;
      border: 1px solid #2a2a2a;
      display: block;
      color: inherit;
      transition: border-color 0.2s;
    }
    .route-card:hover {
      border-color: #d4af37;
    }
    .card-title {
      font-size: 1.2rem;
      font-weight: bold;
      margin: 0 0 6px 0;
      color: #ffffff;
    }
    .card-img {
      width: 100%;
      max-height: 200px;
      object-fit: cover;
      border-radius: 8px;
      margin: 10px 0;
      border: 1px solid #333;
    }
    .card-details {
      color: #aaa;
      font-size: 0.9rem;
      margin-bottom: 10px;
    }
    .btn-gps, .btn-discover {
      display: block;
      text-align: center;
      background-color: #d4af37;
      color: #000;
      text-decoration: none;
      padding: 10px 0;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.9rem;
      margin-top: 10px;
    }
    .btn-discover {
      background-color: #ffffff;
      color: #000000;
    }
    .no-result {
      text-align: center;
      color: #777;
      margin-top: 30px;
    }

    /* --- STYLES DU GUIDE FLUIDE ET FIXE EN HAUT --- */
    .btn-help-icon {
      position: absolute;
      right: 0;
      top: 5px;
      background: #2a2a2a;
      border: 1px solid #d4af37;
      color: #d4af37;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      font-weight: bold;
      cursor: pointer;
      z-index: 10002;
    }
    
    .onboarding-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 9999;
      display: none;
      pointer-events: none;
    }

    /* Bulle d'Aide Haut de Page - Style BD moderne et épuré */
    .top-guide-bubble {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 30px);
      max-width: 360px;
      background: #1c1c1e;
      border: 2px solid #d4af37;
      border-radius: 16px;
      padding: 12px 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.9);
      z-index: 10001;
      pointer-events: auto;
      box-sizing: border-box;
      animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      from { opacity: 0; transform: translate(-50%, -15px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }

    .bubble-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .bubble-badge {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #d4af37;
      font-weight: bold;
    }
    .bubble-title {
      font-size: 0.95rem;
      font-weight: bold;
      margin-bottom: 4px;
      color: #ffffff;
    }
    .bubble-text {
      font-size: 0.82rem;
      color: #dddddd;
      line-height: 1.35;
      margin-bottom: 10px;
    }
    .bubble-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-skip {
      background: transparent;
      border: none;
      color: #888888;
      font-size: 0.78rem;
      cursor: pointer;
      text-decoration: underline;
    }
    .btn-next {
      background: #d4af37;
      color: #000;
      border: none;
      padding: 6px 14px;
      border-radius: 14px;
      font-weight: bold;
      font-size: 0.8rem;
      cursor: pointer;
    }

    /* Cadre Rouge Vif Dynamique sur l'élément ciblée */
    .highlight-guide {
      position: relative !important;
      z-index: 10000 !important;
      outline: 3px solid #ff2a2a !important;
      outline-offset: 3px !important;
      box-shadow: 0 0 15px rgba(255, 42, 42, 0.8) !important;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1 class="title">MUE.<span>SÉUM</span></h1>
    <div class="subtitle">Machine à remonter le temps</div>
    <button class="btn-help-icon" onclick="demarrerAide(true)" title="Revoir le guide">?</button>
  </div>

  <div class="search-bar">
    <input type="text" id="search-input" class="search-input" placeholder="Rechercher villes, parcours..." oninput="filtrerParcours()">
  </div>

  <div class="controls">
    <span>Itinéraires</span>
    <button class="btn-shuffle" onclick="permuterParcours()">🔀 Permuter l'ordre</button>
  </div>

  <div id="container-parcours"></div>

  <!-- OVERLAY & BULLE FIXE EN HAUT -->
  <div id="onboarding-overlay" class="onboarding-overlay">
    <div id="top-guide-bubble" class="top-guide-bubble">
      <div class="bubble-header">
        <span id="bubble-badge" class="bubble-badge">Étape 1 / 3</span>
      </div>
      <div id="bubble-title" class="bubble-title">Titre</div>
      <div id="bubble-text" class="bubble-text">Texte explicatif...</div>
      <div class="bubble-actions">
        <button class="btn-skip" onclick="fermerAide()">Passer</button>
        <button id="btn-next-step" class="btn-next" onclick="etapeSuivante()">Suivant</button>
      </div>
    </div>
  </div>

  <script>
    let parcoursData = [];

    const listeFichiers = Array.from({ length: 60 }, (_, i) => `parcours-${i + 1}.json`);

    Promise.all(
      listeFichiers.map(fichier => 
        fetch(fichier)
          .then(res => res.ok ? res.json() : null)
          .catch(() => null)
      )
    ).then(resultats => {
      parcoursData = resultats.filter(item => item !== null);
      afficherParcours(parcoursData);

      if (!localStorage.getItem('mueseum_accueil_guided_seen')) {
        demarrerAide(false);
      }
    });

    function afficherParcours(liste) {
      const container = document.getElementById('container-parcours');
      container.innerHTML = '';

      if (liste.length === 0) {
        container.innerHTML = '<div class="no-result">Aucun parcours ne correspond à votre recherche.</div>';
        return;
      }

      liste.forEach(item => {
        container.innerHTML += `
          <div class="route-card">
            <div class="card-title">${item.titre}</div>
            ${item.image ? `<img src="${item.image}" class="card-img" alt="">` : ''}
            <div class="card-details">${item.lieu} • ${item.dist} • ${item.dur}</div>
            ${item.gps ? `<a href="${item.gps}" target="_blank" class="btn-gps">📍 Me rendre à la balade</a>` : ''}
            <a href="vue-parcours.html?id=${item.id}" class="btn-discover">🗺️ Découvrir ce parcours</a>
          </div>
        `;
      });
    }

    function filtrerParcours() {
      const recherche = document.getElementById('search-input').value.toLowerCase();
      const resultats = parcoursData.filter(item => 
        item.titre.toLowerCase().includes(recherche) || 
        item.lieu.toLowerCase().includes(recherche)
      );
      afficherParcours(resultats);
    }

    function permuterParcours() {
      if (parcoursData.length > 0) {
        parcoursData.push(parcoursData.shift());
        filtrerParcours();
      }
    }

    // --- GESTION DU GUIDE GUIDÉ PAS À PAS ---
    let etapeActuelle = 0;
    const etapesGuide = [
      {
        badge: "Étape 1 / 3 — Bienvenue",
        title: "Explorez votre choix 🗺️",
        text: "MUE.SÉUM fonctionne <b>sur le terrain OU au chaud chez vous</b> ! Choisissez la carte de votre balade.",
        targetClass: "route-card"
      },
      {
        badge: "Étape 2 / 3 — Trajet",
        title: "Bouton « Me rendre à la balade » 📍",
        text: "Pour aller au point de départ, ce bouton entouré en rouge lance votre itinéraire GPS.",
        targetClass: "btn-gps"
      },
      {
        badge: "Étape 3 / 3 — Lancement",
        title: "Bouton « Découvrir ce parcours » 🥾",
        text: "Sur place ou chez vous, ce bouton entouré en rouge lance la carte interactive !",
        targetClass: "btn-discover"
      }
    ];

    function demarrerAide(force) {
      if (force) localStorage.removeItem('mueseum_accueil_guided_seen');
      etapeActuelle = 0;
      afficherEtapeGuide();
      document.getElementById('onboarding-overlay').style.display = 'block';
    }

    function afficherEtapeGuide() {
      document.querySelectorAll('.highlight-guide').forEach(el => el.classList.remove('highlight-guide'));

      const config = etapesGuide[etapeActuelle];
      document.getElementById('bubble-badge').innerText = config.badge;
      document.getElementById('bubble-title').innerText = config.title;
      document.getElementById('bubble-text').innerHTML = config.text;

      const btnNext = document.getElementById('btn-next-step');
      btnNext.innerText = (etapeActuelle === etapesGuide.length - 1) ? "OK !" : "Suivant";

      const elTarget = document.querySelector('.' + config.targetClass);
      if (elTarget) {
        elTarget.classList.add('highlight-guide');
        
        // Défilement doux qui place l'élément bien dégagé au centre, sous la bulle fixe
        setTimeout(() => {
          elTarget.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 100);
      }
    }

    function etapeSuivante() {
      if (etapeActuelle < etapesGuide.length - 1) {
        etapeActuelle++;
        afficherEtapeGuide();
      } else {
        fermerAide();
      }
    }

    function fermerAide() {
      document.querySelectorAll('.highlight-guide').forEach(el => el.classList.remove('highlight-guide'));
      document.getElementById('onboarding-overlay').style.display = 'none';
      localStorage.setItem('mueseum_accueil_guided_seen', 'true');
    }
  </script>

</body>
</html>
