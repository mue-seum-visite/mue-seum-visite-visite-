<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUE.SÉUM - Accueil</title>
  
  <!-- Compteur de visites GoatCounter -->
  <script data-goatcounter="https://mue-seum.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>

  <!-- PAGE DE GARDE ACCUEIL - MUE.SÉUM -->
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
      position: relative;
    }
    .title {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 1px;
      margin: 0;
    }
    .title span {
      color: #d4af37; /* Couleur dorée pour SÉUM */
    }
    .subtitle {
      font-size: 0.8rem;
      color: #a0a0a0;
      letter-spacing: 2px;
      margin-top: 5px;
    }
    .search-bar {
      margin: 20px 0;
    }
    .search-input {
      width: 100%;
      padding: 12px 20px;
      border-radius: 25px;
      border: 1px solid #333;
      background-color: #1e1e1e;
      color: #fff;
      font-size: 1rem;
      box-sizing: border-box;
      outline: none;
    }
    .search-input:focus {
      border-color: #d4af37;
    }
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .btn-shuffle {
      background-color: #d4af37;
      color: #000;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
    }
    .route-card {
      background-color: #1e1e1e;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 15px;
      border: 1px solid #2a2a2a;
      display: block;
      color: inherit;
      transition: border-color 0.2s;
    }
    .route-card:hover {
      border-color: #d4af37;
    }
    .card-title {
      font-size: 1.2rem;
      font-weight: bold;
      margin: 0 0 6px 0;
      color: #ffffff;
    }
    .card-img {
      width: 100%;
      max-height: 200px;
      object-fit: cover;
      border-radius: 8px;
      margin: 10px 0;
      border: 1px solid #333;
    }
    .card-details {
      color: #aaa;
      font-size: 0.9rem;
      margin-bottom: 10px;
    }
    .btn-gps, .btn-discover {
      display: block;
      text-align: center;
      background-color: #d4af37;
      color: #000;
      text-decoration: none;
      padding: 10px 0;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.9rem;
      margin-top: 10px;
    }
    .btn-discover {
      background-color: #ffffff;
      color: #000000;
    }
    .no-result {
      text-align: center;
      color: #777;
      margin-top: 30px;
    }

    /* --- STYLES SYSTEME DE GUIDAGE --- */
    .btn-help-icon {
      position: absolute;
      right: 0;
      top: 5px;
      background: #2a2a2a;
      border: 1px solid #d4af37;
      color: #d4af37;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      font-weight: bold;
      cursor: pointer;
      z-index: 10;
    }

    .onboarding-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .onboarding-overlay.active {
      display: flex;
    }

    /* Étape 1 : Modale de bienvenue centrée */
    .modal-card {
      background: #1e1e1e;
      border: 2px solid #d4af37;
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.9);
      text-align: center;
    }
    .modal-icon {
      font-size: 2.8rem;
      margin-bottom: 12px;
    }
    .modal-badge {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #d4af37;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .modal-title {
      font-size: 1.25rem;
      font-weight: 800;
      margin-bottom: 10px;
      color: #ffffff;
    }
    .modal-text {
      font-size: 0.9rem;
      color: #cccccc;
      line-height: 1.45;
      margin-bottom: 24px;
    }

    /* Étapes 2 & 3 : Infobulle fixe en haut de page */
    .top-bubble {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 40px);
      max-width: 380px;
      background: #1e1e1e;
      border: 2px solid #d4af37;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.9);
      z-index: 10001;
      box-sizing: border-box;
    }

    .guide-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-guide-skip {
      background: transparent;
      border: none;
      color: #888;
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: underline;
    }
    .btn-guide-next {
      background: #d4af37;
      color: #000;
      border: none;
      padding: 9px 20px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.88rem;
      cursor: pointer;
    }

    /* Surbrillance rouge dynamique */
    .highlight-guide {
      position: relative !important;
      z-index: 10000 !important;
      outline: 3px solid #ff2a2a !important;
      outline-offset: 3px !important;
      box-shadow: 0 0 18px rgba(255, 42, 42, 0.8) !important;
      border-radius: 12px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1 class="title">MUE.<span>SÉUM</span></h1>
    <div class="subtitle">Machine à remonter le temps</div>
    <button class="btn-help-icon" onclick="demarrerAide()" title="Revoir le guide">?</button>
  </div>

  <div class="search-bar">
    <input type="text" id="search-input" class="search-input" placeholder="Rechercher villes, parcours..." oninput="filtrerParcours()">
  </div>

  <div class="controls">
    <span>Itinéraires</span>
    <button class="btn-shuffle" onclick="permuterParcours()">🔀 Permuter l'ordre</button>
  </div>

  <div id="container-parcours"></div>

  <!-- OVERLAY DU GUIDE PAS À PAS -->
  <div id="onboarding-overlay" class="onboarding-overlay">
    
    <!-- ÉTAPE 1 : CAPSULE DE BIENVENUE -->
    <div id="step-modal" class="modal-card">
      <div class="modal-icon">🗺️</div>
      <div class="modal-badge">Étape 1 / 3 — Bienvenue</div>
      <div class="modal-title">Explorez à votre rythme</div>
      <div class="modal-text">
        MUE.SÉUM s'utilise <b>sur le terrain OU directement depuis chez vous</b> ! Parcourez la liste pour choisir la balade historique de votre choix.
      </div>
      <div class="guide-actions">
        <button class="btn-guide-skip" onclick="fermerAide()">Ignorer</button>
        <button class="btn-guide-next" onclick="etapeSuivante()">Suivant</button>
      </div>
    </div>

    <!-- ÉTAPES 2 & 3 : BULLE SUPÉRIEURE AVEC SURBRILLANCE ROUGE -->
    <div id="step-bubble" class="top-bubble" style="display: none;">
      <div id="bubble-badge" class="modal-badge">Étape 2 / 3</div>
      <div id="bubble-title" class="modal-title">Titre</div>
      <div id="bubble-text" class="modal-text">Texte explicatif...</div>
      <div class="guide-actions">
        <button class="btn-guide-skip" onclick="fermerAide()">Ignorer</button>
        <button id="btn-bubble-next" class="btn-guide-next" onclick="etapeSuivante()">Suivant</button>
      </div>
    </div>

  </div>

  <script>
    let parcoursData = [];

    // Génération automatique des noms de fichiers de parcours-1.json à parcours-60.json
    const listeFichiers = Array.from({ length: 60 }, (_, i) => `parcours-${i + 1}.json`);

    // Chargement dynamique de chaque fichier individuel s'il existe
    Promise.all(
      listeFichiers.map(fichier => 
        fetch(fichier)
          .then(res => res.ok ? res.json() : null)
          .catch(() => null)
      )
    ).then(resultats => {
      // Filtrer pour garder uniquement les parcours réellement créés
      parcoursData = resultats.filter(item => item !== null);
      afficherParcours(parcoursData);

      // Lancement AUTOMATIQUE à chaque accès ou rechargement de la page
      demarrerAide();
    });

    function afficherParcours(liste) {
      const container = document.getElementById('container-parcours');
      container.innerHTML = '';

      if (liste.length === 0) {
        container.innerHTML = '<div class="no-result">Aucun parcours ne correspond à votre recherche.</div>';
        return;
      }

      liste.forEach(item => {
        container.innerHTML += `
          <div class="route-card">
            <div class="card-title">${item.titre}</div>
            ${item.image ? `<img src="${item.image}" class="card-img" alt="">` : ''}
            <div class="card-details">${item.lieu} • ${item.dist} • ${item.dur}</div>
            ${item.gps ? `<a href="${item.gps}" target="_blank" class="btn-gps">📍 Me rendre à la balade</a>` : ''}
            <a href="vue-parcours.html?id=${item.id}" class="btn-discover">🗺️ Découvrir ce parcours</a>
          </div>
        `;
      });
    }

    function filtrerParcours() {
      const recherche = document.getElementById('search-input').value.toLowerCase();
      const resultats = parcoursData.filter(item => 
        item.titre.toLowerCase().includes(recherche) || 
        item.lieu.toLowerCase().includes(recherche)
      );
      afficherParcours(resultats);
    }

    function permuterParcours() {
      if (parcoursData.length > 0) {
        parcoursData.push(parcoursData.shift());
        filtrerParcours();
      }
    }

    // --- GESTION DU GUIDE GUIDÉ PAS À PAS ---
    let etapeActuelle = 0;

    const configEtapes = [
      {
        type: "modal" // Étape 1 : Modale centrée fixe
      },
      {
        type: "highlight", // Étape 2 : Surbrillance bouton GPS
        badge: "Étape 2 / 3 — Sur le terrain",
        title: "Bouton « Me rendre à la balade » 📍",
        text: "Vous souhaitez vous rendre sur place ? Ce bouton (entouré en rouge) ouvre votre GPS (Waze, Google Maps...) jusqu'au départ.",
        targetClass: "btn-gps"
      },
      {
        type: "highlight", // Étape 3 : Surbrillance bouton Découvrir",
        badge: "Étape 3 / 3 — Immersion",
        title: "Bouton « Découvrir ce parcours » 🥾",
        text: "Que vous soyez <b>sur place ou chez vous</b>, ce bouton (entouré en rouge) ouvre la carte interactive pour commencer l'aventure !",
        targetClass: "btn-discover"
      }
    ];

    function demarrerAide() {
      etapeActuelle = 0;
      afficherEtape();
      document.getElementById('onboarding-overlay').classList.add('active');
    }

    function afficherEtape() {
      document.querySelectorAll('.highlight-guide').forEach(el => el.classList.remove('highlight-guide'));

      const config = configEtapes[etapeActuelle];

      if (config.type === "modal") {
        document.getElementById('step-modal').style.display = 'block';
        document.getElementById('step-bubble').style.display = 'none';
      } else {
        document.getElementById('step-modal').style.display = 'none';
        document.getElementById('step-bubble').style.display = 'block';

        document.getElementById('bubble-badge').innerText = config.badge;
        document.getElementById('bubble-title').innerText = config.title;
        document.getElementById('bubble-text').innerHTML = config.text;

        const btnNext = document.getElementById('btn-bubble-next');
        btnNext.innerText = (etapeActuelle === configEtapes.length - 1) ? "C'est compris !" : "Suivant";

        const elTarget = document.querySelector('.' + config.targetClass);
        if (elTarget) {
          elTarget.classList.add('highlight-guide');
          setTimeout(() => {
            elTarget.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }, 100);
        }
      }
    }

    function etapeSuivante() {
      if (etapeActuelle < configEtapes.length - 1) {
        etapeActuelle++;
        afficherEtape();
      } else {
        fermerAide();
      }
    }

    function fermerAide() {
      document.querySelectorAll('.highlight-guide').forEach(el => el.classList.remove('highlight-guide'));
      document.getElementById('onboarding-overlay').classList.remove('active');
    }
  </script>

</body>
</html>
