    function initialiserCarte(points) {
      if (!points || points.length === 0) return;

      const map = L.map('map').setView([points[0].lat, points[0].lng], 14);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      }).addTo(map);

      const coordonnees = [];

      points.forEach(pt => {
        const titreAnim = pt.titre_animation || pt.nom;
        const contenuPopup = `
          <div class="popup-content">
            <b>${pt.nom}</b><br>
            <p style="margin: 4px 0; font-size: 0.85rem;">${titreAnim}</p>
            <button class="btn-ar" onclick="lancerExperience('${pt.video}')">📸 Lancer l'expérience</button>
          </div>

      }

        modelSelection: 1, // 1 = Haute qualité Landscape (Style Teams)
      });

      selfieSegmentation.onResults(surResultatsDétourage);
    }
    initialiserIA();

    function lancerExperience(videoUrl) {
      const arOverlay = document.getElementById('ar-overlay');
      const cameraFeed = document.getElementById('camera-feed');
      const videoOverlay = document.getElementById('video-overlay');

      videoOverlay.src = videoUrl;
      videoOverlay.muted = true;
      videoOverlay.currentTime = 0;
      
      const playPromise = videoOverlay.play();
      if (playPromise !== undefined) {
        playPromise.catch(error => {
          videoOverlay.play();
        });

        cameraInstance.stop();
      }

        onFrame: async () => {
          await selfieSegmentation.send({ image: cameraFeed });
        },
        width: 1280,
        height: 720,
        facingMode: 'user'
      });
      cameraInstance.start();
    }

    function fermerCamera() {
      const arOverlay = document.getElementById('ar-overlay');
      const cameraFeed = document.getElementById('camera-feed');
      const videoOverlay = document.getElementById('video-overlay');
      
      if (cameraInstance) {
        cameraInstance.stop();
      }
      videoOverlay.pause();
      arOverlay.style.display = 'none';
      lastMaskCanvas = null; // Nettoyage mémoire

    function surResultatsDétourage(results) {
      const canvas = document.getElementById('ar-canvas-render');
      const ctx = canvas.getContext('2d');
      const videoOverlay = document.getElementById('video-overlay');

      canvas.width = results.image.width || 1280;
      canvas.height = results.image.height || 720;

      // Initialisation du canvas mémoire de lissage au démarrage
      if (!lastMaskCanvas) {
        lastMaskCanvas = document.createElement('canvas');
        lastMaskCanvas.width = canvas.width;
        lastMaskCanvas.height = canvas.height;
        lastMaskCtx = lastMaskCanvas.getContext('2d');
      }

      ctx.save();
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // STEP 1 : ARRIÈRE-PLAN (Vidéo/Animation N&B/Couleur) - Rendu net et fixe

        ctx.drawImage(videoOverlay, 0, 0, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = "#111111";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      // STEP 2 : LISSAGE TEMPOREL DOUX (Alpha blending léger du masque)
      // Fusionne très légèrement le masque actuel avec la trame précédente pour stabiliser les micro-vibrations
      lastMaskCtx.globalAlpha = 0.25; // Facteur de lissage (bas = stable, haut = réactif)

      lastMaskCtx.globalAlpha = 1.0; // Reset

      // STEP 3 : INCUSTATION PRÉCISE DE L'UTILISATEUR
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = canvas.width;
      tempCanvas.height = canvas.height;
      const tempCtx = tempCanvas.getContext('2d');

      // Application du masque lissé
      tempCtx.drawImage(lastMaskCanvas, 0, 0, canvas.width, canvas.height);
      tempCtx.globalCompositeOperation = 'source-in';

      // Rendu miroir de la personne en couleurs modernes

      tempCtx.translate(canvas.width, 0);
      tempCtx.scale(-1, 1);
      tempCtx.drawImage(results.image, 0, 0, canvas.width, canvas.height);
      tempCtx.restore();

      // Dessin final de l'utilisateur détouré proprement sur le fond historique
      ctx.drawImage(tempCanvas, 0, 0);

      ctx.restore();
    }

Le code précédent a déraillé car l'algorithme de lissage temporel que j'ai tenté d'appliquer pour stabiliser le contour était trop brutal pour les processeurs de smartphones, créant cet effet "fantôme" (la catastrophe de la photo).

### La nouvelle approche pour la perfection "Style Teams"

Pour atteindre cette stabilité parfaite sans fantôme et sans confusion de mobilier, nous allons activer deux paramètres de précision "cachés" de MediaPipe. C'est le réglage le plus précis qu'on puisse avoir sur un navigateur mobile aujourd'hui :

1.  **La Stabilité Temporaire Douce (Temporal Smoothing) :** Au lieu de fusionner les images (ce qui crée le fantôme), on active un paramètre interne de l'IA qui adoucit simplement la forme du masque sans accumuler la mémoire. C'est comme un filtre qui supprime le tremblement mais garde la personne nette.
2.  **Le Seuil de Confiance strict (Ignoring non-humans) :** On augmente le seuil de détection. Si l'IA n'est pas sûre à plus de 75 % qu'un pixel est un humain, elle l'ignore. Cela éliminera les faux positifs dus aux chaises, meubles ou cadres derrière vous.

      tempCtx.scale(-1, 1);
      tempCtx.drawImage(results.image, 0, 0, canvas.width, canvas.height);
      tempCtx.restore();

      // Dessin final de l'utilisateur détouré proprement sur le fond historique
      ctx.drawImage(tempCanvas, 0, 0);

      ctx.restore();
    }

    function prendrePhotoCombiner() {
      const renderCanvas = document.getElementById('ar-canvas-render');

      renderCanvas.toBlob(async (blob) => {
        if (!blob) return;
        const file = new File([blob], `mueseum-souvenir-${Date.now()}.png`, { type: 'image/png' });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({
              files: [file],
              title: 'Mon souvenir MUE.SÉUM',
              text: 'Voici ma capture en réalité augmentée !'
            });
          } catch (err) {
            console.log("Partage annulé");
          }
        } else {
          const imageURL = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = imageURL;
          link.download = `mueseum-souvenir.png`;
          link.click();
        }
      }, 'image/png');
    }

    function obtenirMimeTypeVideo() {
      const types = [
        'video/mp4;codecs=avc1',
        'video/mp4',
        'video/webm;codecs=vp9',
        'video/webm;codecs=vp8',
        'video/webm'
      ];
      for (let t of types) {
        if (MediaRecorder.isTypeSupported(t)) return t;
      }
      return '';
    }

    function toggleEnregistrementCombiner() {
      const btnRecord = document.getElementById('btn-record');
      const renderCanvas = document.getElementById('ar-canvas-render');

      if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
        btnRecord.textContent = "🔴 Filmer la scène";
        btnRecord.style.backgroundColor = "#d4af37";
      } else {
        recordedChunks = [];
        const mimeType = obtenirMimeTypeVideo();
        const canvasStream = renderCanvas.captureStream(25);

        try {
          mediaRecorder = mimeType ? new MediaRecorder(canvasStream, { mimeType }) : new MediaRecorder(canvasStream);
        } catch (e) {
          mediaRecorder = new MediaRecorder(canvasStream);
        }

        mediaRecorder.ondataavailable = e => { if (e.data && e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.onstop = async () => {
          const formatExtension = mimeType.includes('mp4') ? 'mp4' : 'webm';
          const typeMimeFinal = mimeType.includes('mp4') ? 'video/mp4' : 'video/webm';

          const blob = new Blob(recordedChunks, { type: typeMimeFinal });
          const file = new File([blob], `mueseum-video-${Date.now()}.${formatExtension}`, { type: typeMimeFinal });

          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            try {
              await navigator.share({
                files: [file],
                title: 'Vidéo MUE.SÉUM'
              });
            } catch (err) {
              console.log("Partage annulé");
            }
          } else {
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `mueseum-video.${formatExtension}`;
            a.click();
          }
        };

        mediaRecorder.start();
        btnRecord.textContent = "⏹️ Arrêter";
        btnRecord.style.backgroundColor = "#ff4444";
      }
    }
  </script>
