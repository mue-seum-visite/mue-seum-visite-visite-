<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Découverte du parcours - MUE.SÉUM</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    .header {
      padding: 15px;
      background-color: #1e1e1e;
      border-bottom: 1px solid #2a2a2a;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn-back {
      background-color: #d4af37;
      color: #000;
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 15px;
      font-weight: bold;
      font-size: 0.85rem;
    }
    .title {
      font-size: 1.1rem;
      font-weight: bold;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #map {
      flex: 1;
      width: 100%;
    }

    .popup-content {
      text-align: center;
      color: #000;
      padding: 4px;
    }
    .btn-ar {
      background-color: #d4af37;
      color: #000;
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 6px;
    }
    #ar-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 9999;
    }
    
    #ar-canvas-render {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #camera-feed, #video-overlay {
      display: none;
    }

    .btn-close-ar {
      position: absolute;
      top: calc(20px + env(safe-area-inset-top));
      right: 20px;
      background: rgba(0,0,0,0.8);
      color: #fff;
      border: 1px solid #d4af37;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      z-index: 10000;
      cursor: pointer;
    }

    .ar-controls {
      position: absolute;
      bottom: calc(100px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 10000;
      background: rgba(0, 0, 0, 0.65);
      padding: 10px 18px;
      border-radius: 40px;
      backdrop-filter: blur(8px);
    }
    .btn-capture {
      background-color: #d4af37;
      color: #000;
      border: none;
      padding: 12px 18px;
      border-radius: 25px;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <div class="header">
    <a href="index.html" class="btn-back">⬅ Accueil</a>
    <h1 id="parcours-title" class="title">Chargement...</h1>
  </div>

  <div id="map"></div>

  <div id="ar-overlay">
    <button class="btn-close-ar" onclick="fermerCamera()">❌ Fermer</button>
    
    <canvas id="ar-canvas-render"></canvas>

    <video id="camera-feed" autoplay playsinline muted></video>
    <video id="video-overlay" autoplay loop muted playsinline crossorigin="anonymous"></video>

    <div class="ar-controls">
      <button class="btn-capture" onclick="prendrePhotoCombiner()">📸 Capturer Photo</button>
      <button class="btn-capture" id="btn-record" onclick="toggleEnregistrementCombiner()">🔴 Filmer la scène</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const parcoursId = urlParams.get('id');

    let mediaRecorder;
    let recordedChunks = [];
    let selfieSegmentation;
    let cameraInstance;

    // Variables pour le lissage temporel (Anti-tremblement)
    let lastMaskCanvas = null;
    let lastMaskCtx = null;

    if (!parcoursId) {
      document.getElementById('parcours-title').textContent = "Parcours introuvable";
    } else {
      fetch(`parcours-${parcoursId}.json`)
        .then(res => res.json())
        .then(data => {
          document.getElementById('parcours-title').textContent = data.titre;
          initialiserCarte(data.points);
        })
        .catch(() => {
          document.getElementById('parcours-title').textContent = "Erreur de chargement";
        });
    }

    function initialiserCarte(points) {
      if (!points || points.length === 0) return;

      const map = L.map('map').setView([points[0].lat, points[0].lng], 14);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      }).addTo(map);

      const coordonnees = [];

      points.forEach(pt => {
        const titreAnim = pt.titre_animation || pt.nom;
        const contenuPopup = `
          <div class="popup-content">
            <b>${pt.nom}</b><br>
            <p style="margin: 4px 0; font-size: 0.85rem;">${titreAnim}</p>
            <button class="btn-ar" onclick="lancerExperience('${pt.video}')">📸 Lancer l'expérience</button>
          </div>
        `;

        L.marker([pt.lat, pt.lng]).addTo(map).bindPopup(contenuPopup);
        coordonnees.push([pt.lat, pt.lng]);
      });

      if (coordonnees.length > 1) {
        map.fitBounds(coordonnees, { padding: [30, 30] });
      }
    }

    // Initialisation IA avec mode Haute Précision
    function initialiserIA() {
      selfieSegmentation = new SelfieSegmentation({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
      });

      selfieSegmentation.setOptions({
        modelSelection: 1, // Modèle paysage optimisé
      });

      selfieSegmentation.onResults(surResultatsDétourage);
    }
    initialiserIA();

    function lancerExperience(videoUrl) {
      const arOverlay = document.getElementById('ar-overlay');
      const cameraFeed = document.getElementById('camera-feed');
      const videoOverlay = document.getElementById('video-overlay');

      videoOverlay.src = videoUrl;
      videoOverlay.muted = true;
      videoOverlay.currentTime = 0;
      
      const playPromise = videoOverlay.play();
      if (playPromise !== undefined) {
        playPromise.catch(error => {
          videoOverlay.play();
        });
      }

      arOverlay.style.display = 'block';

      if (cameraInstance) {
        cameraInstance.stop();
      }

      cameraInstance = new Camera(cameraFeed, {
        onFrame: async () => {
          await selfieSegmentation.send({ image: cameraFeed });
        },
        width: 1280,
        height: 720,
        facingMode: 'user'
      });
      cameraInstance.start();
    }

    function fermerCamera() {
      const arOverlay = document.getElementById('ar-overlay');
      const cameraFeed = document.getElementById('camera-feed');
      const videoOverlay = document.getElementById('video-overlay');
      
      if (cameraInstance) {
        cameraInstance.stop();
      }
      videoOverlay.pause();
      arOverlay.style.display = 'none';
      lastMaskCanvas = null;
    }

    // RENDU HAUTE PRÉCISION : LISSAGE TEMPOREL + FUSION HISTORIQUE
    function surResultatsDétourage(results) {
      const canvas = document.getElementById('ar-canvas-render');
      const ctx = canvas.getContext('2d');
      const videoOverlay = document.getElementById('video-overlay');

      canvas.width = results.image.width || 1280;
      canvas.height = results.image.height || 720;

      // Initialisation du canvas de mémoire pour le lissage
      if (!lastMaskCanvas) {
        lastMaskCanvas = document.createElement('canvas');
        lastMaskCanvas.width = canvas.width;
        lastMaskCanvas.height = canvas.height;
        lastMaskCtx = lastMaskCanvas.getContext('2d');
      }

      ctx.save();
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. ARRIÈRE-PLAN : Décor vidéo ou archive
      if (videoOverlay && videoOverlay.readyState >= 2) {
        ctx.drawImage(videoOverlay, 0, 0, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = "#111111";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      // 2. LISSAGE TEMPOREL DU MASQUE (Absorbe les vibrations et retient la forme)
      // Fusion de 70% du masque actuel avec 30% de la trame précédente
      lastMaskCtx.globalAlpha = 0.30;
      lastMaskCtx.drawImage(results.segmentationMask, 0, 0, canvas.width, canvas.height);
      lastMaskCtx.globalAlpha = 1.0;

      // 3. PREMIER PLAN (Découpe exacte de la personne sans le mobilier)
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = canvas.width;
      tempCanvas.height = canvas.height;
      const tempCtx = tempCanvas.getContext('2d');

      // Application du masque lissé
      tempCtx.drawImage(lastMaskCanvas, 0, 0, canvas.width, canvas.height);
      tempCtx.globalCompositeOperation = 'source-in';

      // Dessin de l'utilisateur avec correction miroir
      tempCtx.save();
      tempCtx.translate(canvas.width, 0);
      tempCtx.scale(-1, 1);
      
      // Filtre d'harmonisation de couleur et contraste (Fusion visuelle rétro)
      tempCtx.filter = "contrast(1.05) saturate(0.90)";
      tempCtx.drawImage(results.image, 0, 0, canvas.width, canvas.height);
      tempCtx.restore();

      // Dessin final sur l'arrière-plan
      ctx.drawImage(tempCanvas, 0, 0);

      ctx.restore();
    }

    function prendrePhotoCombiner() {
      const renderCanvas = document.getElementById('ar-canvas-render');

      renderCanvas.toBlob(async (blob) => {
        if (!blob) return;
        const file = new File([blob], `mueseum-souvenir-${Date.now()}.png`, { type: 'image/png' });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({
              files: [file],
              title: 'Mon souvenir MUE.SÉUM',
              text: 'Voici ma capture en réalité augmentée !'
            });
          } catch (err) {
            console.log("Partage annulé");
          }
        } else {
          const imageURL = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = imageURL;
          link.download = `mueseum-souvenir.png`;
          link.click();
        }
      }, 'image/png');
    }

    function obtenirMimeTypeVideo() {
      const types = [
        'video/mp4;codecs=avc1',
        'video/mp4',
        'video/webm;codecs=vp9',
        'video/webm;codecs=vp8',
        'video/webm'
      ];
      for (let t of types) {
        if (MediaRecorder.isTypeSupported(t)) return t;
      }
      return '';
    }

    function toggleEnregistrementCombiner() {
      const btnRecord = document.getElementById('btn-record');
      const renderCanvas = document.getElementById('ar-canvas-render');

      if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
        btnRecord.textContent = "🔴 Filmer la scène";
        btnRecord.style.backgroundColor = "#d4af37";
      } else {
        recordedChunks = [];
        const mimeType = obtenirMimeTypeVideo();
        const canvasStream = renderCanvas.captureStream(25);

        try {
          mediaRecorder = mimeType ? new MediaRecorder(canvasStream, { mimeType }) : new MediaRecorder(canvasStream);
        } catch (e) {
          mediaRecorder = new MediaRecorder(canvasStream);
        }

        mediaRecorder.ondataavailable = e => { if (e.data && e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.onstop = async () => {
          const formatExtension = mimeType.includes('mp4') ? 'mp4' : 'webm';
          const typeMimeFinal = mimeType.includes('mp4') ? 'video/mp4' : 'video/webm';

          const blob = new Blob(recordedChunks, { type: typeMimeFinal });
          const file = new File([blob], `mueseum-video-${Date.now()}.${formatExtension}`, { type: typeMimeFinal });

          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            try {
              await navigator.share({
                files: [file],
                title: 'Vidéo MUE.SÉUM'
              });
            } catch (err) {
              console.log("Partage annulé");
            }
          } else {
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `mueseum-video.${formatExtension}`;
            a.click();
          }
        };

        mediaRecorder.start();
        btnRecord.textContent = "⏹️ Arrêter";
        btnRecord.style.backgroundColor = "#ff4444";
      }
    }
  </script>

</body>
</html>
