<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Découverte du parcours - MUE.SÉUM</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Chargement de MediaPipe Selfie Segmentation -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    #map {
      width: 100vw;
      height: 100vh;
    }

    .popup-content { text-align: center; color: #000; }
    .btn-ar {
      background-color: #d4af37;
      color: #000;
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 6px;
    }
    
    #ar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 99999;
    }

    #ar-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 2;
    }

    #webcam-feed, #background-video {
      display: none;
    }

    .btn-close-ar {
      position: absolute;
      top: calc(20px + env(safe-area-inset-top));
      right: 20px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      border: 1px solid #d4af37;
      padding: 10px 18px;
      border-radius: 25px;
      font-weight: bold;
      z-index: 10;
      cursor: pointer;
    }

    .ar-controls {
      position: absolute;
      bottom: calc(90px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.75);
      padding: 10px 18px;
      border-radius: 40px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(212, 175, 55, 0.4);
    }

    .btn-capture, .btn-record {
      background-color: #d4af37;
      color: #000;
      border: none;
      padding: 10px 18px;
      border-radius: 25px;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .btn-record.recording {
      background-color: #e74c3c;
      color: #fff;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div id="ar-overlay">
    <button class="btn-close-ar" onclick="fermerExperience()">❌ Fermer</button>
    
    <video id="webcam-feed" playsinline autoplay muted></video>
    <video id="background-video" playsinline autoplay loop muted crossorigin="anonymous"></video>
    <canvas id="ar-canvas"></canvas>

    <div class="ar-controls">
      <button class="btn-capture" onclick="telechargerPhoto()">📸 Photo</button>
      <button class="btn-record" id="btn-rec" onclick="basculerEnregistrement()">🎥 Filmer</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const parcoursId = urlParams.get('id');

    let videoElement = document.getElementById('webcam-feed');
    let bgVideoElement = document.getElementById('background-video');
    let canvasElement = document.getElementById('ar-canvas');
    let ctx = canvasElement.getContext('2d');
    
    let cameraStream = null;
    let selfieSegmentation = null;
    let fondEpocheImg = new Image();
    let isBgVideo = false;
    let isProcessing = false;

    // Gestion enregistrement & partage vidéo
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;

    // Variables pour la géolocalisation GPS
    let userMarker = null;
    let isTracking = false;

    const personCanvas = document.createElement('canvas');
    const pCtx = personCanvas.getContext('2d');

    // Sécurisation du retour navigateur (Option 1)
    window.onpopstate = function(event) {
      const arOverlay = document.getElementById('ar-overlay');
      if (arOverlay && arOverlay.style.display === 'block') {
        fermerExperience();
      }
    };

    if (!parcoursId) {
      const titleEl = document.getElementById('parcours-title');
      if (titleEl) titleEl.textContent = "Parcours introuvable";
    } else {
      fetch(`parcours-${parcoursId}.json`)
        .then(res => res.json())
        .then(data => {
          const titleEl = document.getElementById('parcours-title');
          if (titleEl) titleEl.textContent = data.titre;
          // MODIFICATION : transmission de l'objet data complet (avec points et trace)
          initialiserCarte(data);
        })
        .catch(() => {
          const titleEl = document.getElementById('parcours-title');
          if (titleEl) titleEl.textContent = "Erreur de chargement";
        });
    }

    function initialiserCarte(data) {
      const points = data.points;
      if (!points || points.length === 0) return;

      const map = L.map('map').setView([points[0].lat, points[0].lng], 14);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      }).addTo(map);

      // --- AJOUT : Bouton fixe "Accueil" ---
      const backControl = L.control({ position: 'topleft' });
      backControl.onAdd = function() {
        const div = L.DomUtil.create('div', 'leaflet-bar leaflet-control');
        div.innerHTML = `
          <a href="index.html" style="
            background: #d4af37; 
            color: #000000; 
            text-decoration: none; 
            padding: 8px 14px; 
            display: inline-block;
            font-weight: bold; 
            font-size: 0.85rem;
            border-radius: 4px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
          ">⬅ Accueil</a>
        `;
        return div;
      };
      backControl.addTo(map);

      // --- AJOUT : Badge Titre en bas à gauche ---
      const titleControl = L.control({ position: 'bottomleft' });
      titleControl.onAdd = function() {
        const div = L.DomUtil.create('div', 'leaflet-bar leaflet-control');
        div.innerHTML = `
          <div id="parcours-title" style="
            background: rgba(0, 0, 0, 0.75); 
            color: #ffffff; 
            padding: 6px 12px; 
            font-weight: bold; 
            font-size: 0.9rem;
            border-radius: 4px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(212, 175, 55, 0.4);
            max-width: 250px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
          ">${data.titre || 'Chargement...'}</div>
        `;
        return div;
      };
      titleControl.addTo(map);

      // --- AJOUT : Dessin de la ligne du tracé si "trace" est présent ---
      if (data.trace && data.trace.length > 0) {
        const routePath = L.polyline(data.trace, {
          color: '#d4af37',   // Couleur dorée assortie à votre charte MUE.SÉUM
          weight: 4,          // Épaisseur de la ligne
          opacity: 0.8,
          dashArray: '8, 8'   // Ligne pointillée
        }).addTo(map);

        map.fitBounds(routePath.getBounds(), { padding: [40, 40] });
      }

      points.forEach(pt => {
        const titreAnim = pt.titre_animation || pt.nom;
        
        // Affichage conditionnel du bouton : seulement si un nom de fichier vidéo est renseigné
        const boutonHtml = (pt.video && pt.video.trim() !== '') 
          ? `<button class="btn-ar" onclick="lancerExperience('${pt.video}')">🚀 Entrer dans l'époque</button>` 
          : '';

        const contenuPopup = `
          <div class="popup-content">
            <b>${pt.nom}</b><br>
            <p style="margin: 4px 0; font-size: 0.85rem;">${titreAnim}</p>
            ${boutonHtml}
          </div>
        `;

        L.marker([pt.lat, pt.lng]).addTo(map).bindPopup(contenuPopup);
      });

      // --- AJOUT : Bouton de contrôle GPS ---
      const gpsControl = L.control({ position: 'topright' });
      gpsControl.onAdd = function() {
        const div = L.DomUtil.create('div', 'leaflet-bar leaflet-control');
        div.innerHTML = `
          <button id="btn-gps" style="
            background: #ffffff; 
            color: #000000; 
            border: none; 
            padding: 8px 12px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 0.85rem;
            border-radius: 4px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
          ">📍 Lancer le GPS</button>
        `;
        return div;
      };
      gpsControl.addTo(map);

      // Événement clic sur le bouton GPS
      document.addEventListener('click', function(e) {
        if (e.target && e.target.id === 'btn-gps') {
          if (!isTracking) {
            map.locate({ setView: true, maxZoom: 17, watch: true, enableHighAccuracy: true });
            e.target.innerHTML = '🛑 Arrêter le GPS';
            e.target.style.background = '#e74c3c';
            e.target.style.color = '#ffffff';
            isTracking = true;
          } else {
            map.stopLocate();
            if (userMarker) {
              map.removeLayer(userMarker);
              userMarker = null;
            }
            e.target.innerHTML = '📍 Lancer le GPS';
            e.target.style.background = '#ffffff';
            e.target.style.color = '#000000';
            isTracking = false;
          }
        }
      });

      // Mettre à jour la position de l'utilisateur (Point Rouge)
      map.on('locationfound', function(e) {
        if (!userMarker) {
          userMarker = L.circleMarker(e.latlng, {
            radius: 8,
            fillColor: '#ff0000', // Point Rouge
            color: '#ffffff',     // Contour blanc
            weight: 3,
            opacity: 1,
            fillOpacity: 0.9
          }).addTo(map).bindPopup("Vous êtes ici");
        } else {
          userMarker.setLatLng(e.latlng);
        }
      });

      map.on('locationerror', function() {
        alert("Impossible d'accéder à votre géolocalisation. Vérifiez vos autorisations.");
      });
    }

    async function lancerExperience(mediaUrl) {
      const arOverlay = document.getElementById('ar-overlay');
      arOverlay.style.display = 'block';

      // Ajout de l'état dans l'historique pour capturer la touche retour
      history.pushState({ arOuvert: true }, "");

      // Nettoyage de l'URL pour la détection du format (.mp4, .webm, .mov)
      const urlPropre = mediaUrl.split('?')[0].toLowerCase();
      isBgVideo = urlPropre.endsWith('.mp4') || urlPropre.endsWith('.webm') || urlPropre.endsWith('.mov');

      if (isBgVideo) {
        bgVideoElement.src = mediaUrl;
        bgVideoElement.currentTime = 0;
        try {
          await bgVideoElement.play();
        } catch (err) {
          console.log("Erreur lecture vidéo:", err);
        }
      } else {
        fondEpocheImg.crossOrigin = "anonymous";
        fondEpocheImg.src = mediaUrl;
      }

      if (!selfieSegmentation) {
        selfieSegmentation = new SelfieSegmentation({
          locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
        });

        selfieSegmentation.setOptions({
          modelSelection: 1,
          selfieMode: true
        });

        selfieSegmentation.onResults(onResults);
      }

      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        videoElement.srcObject = cameraStream;
        await videoElement.play();

        isProcessing = true;
        processVideo();
      } catch (err) {
        alert("Impossible d'accéder à la caméra : " + err.message);
      }
    }

    async function processVideo() {
      if (!isProcessing) return;
      if (videoElement.readyState >= 2) {
        await selfieSegmentation.send({ image: videoElement });
      }
      requestAnimationFrame(processVideo);
    }

    function onResults(results) {
      const w = results.image.width;
      const h = results.image.height;

      canvasElement.width = personCanvas.width = w;
      canvasElement.height = personCanvas.height = h;

      // 1. Découpage personne
      pCtx.save();
      pCtx.clearRect(0, 0, w, h);
      pCtx.drawImage(results.image, 0, 0, w, h);
      pCtx.globalCompositeOperation = 'destination-in';
      pCtx.filter = 'blur(4px)';
      pCtx.drawImage(results.segmentationMask, 0, 0, w, h);
      pCtx.restore();

      // 2. Rendu final du fond
      ctx.clearRect(0, 0, w, h);

      if (isBgVideo && bgVideoElement.readyState >= 2) {
        ctx.drawImage(bgVideoElement, 0, 0, w, h);
      } else if (!isBgVideo && fondEpocheImg.complete && fondEpocheImg.naturalWidth !== 0) {
        ctx.drawImage(fondEpocheImg, 0, 0, w, h);
      } else {
        ctx.fillStyle = "#111";
        ctx.fillRect(0, 0, w, h);
      }

      // 3. Superposition de la personne
      ctx.drawImage(personCanvas, 0, 0, w, h);

      // 4. Incrustation dynamique de la marque MUE.SÉUM
      const fontSize = Math.max(16, Math.round(w * 0.035));
      ctx.save();
      ctx.font = `bold ${fontSize}px -apple-system, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "bottom";

      ctx.shadowColor = "rgba(0, 0, 0, 0.8)";
      ctx.shadowBlur = 6;
      ctx.shadowOffsetX = 2;
      ctx.shadowOffsetY = 2;

      ctx.fillStyle = "#d4af37";
      ctx.fillText("✨ Souvenir MUE.SÉUM", w / 2, h - (h * 0.04));
      ctx.restore();
    }

    function fermerExperience() {
      isProcessing = false;
      if (isRecording) basculerEnregistrement();
      
      const arOverlay = document.getElementById('ar-overlay');
      if (bgVideoElement) bgVideoElement.pause();
      
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }
      arOverlay.style.display = 'none';
    }

    function telechargerPhoto() {
      canvasElement.toBlob(async (blob) => {
        if (!blob) return;
        const file = new File([blob], `mueseum-photo-${Date.now()}.png`, { type: 'image/png' });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({
              files: [file],
              title: 'Souvenir MUE.SÉUM',
              text: 'Regarde ma photo dans le temps !'
            });
          } catch (e) {}
        } else {
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = `mueseum-souvenir.png`;
          a.click();
        }
      }, 'image/png');
    }

    function obtenirMimeTypeVideo() {
      const types = [
        'video/mp4;codecs=avc1',
        'video/mp4',
        'video/webm;codecs=vp9',
        'video/webm;codecs=vp8',
        'video/webm'
      ];
      for (let t of types) {
        if (MediaRecorder.isTypeSupported(t)) return t;
      }
      return '';
    }

    function basculerEnregistrement() {
      const btnRec = document.getElementById('btn-rec');
      
      if (isRecording) {
        mediaRecorder.stop();
        isRecording = false;
        btnRec.textContent = "🎥 Filmer";
        btnRec.classList.remove('recording');
      } else {
        recordedChunks = [];
        const mimeType = obtenirMimeTypeVideo();
        const canvasStream = canvasElement.captureStream(30);

        try {
          mediaRecorder = mimeType ? new MediaRecorder(canvasStream, { mimeType }) : new MediaRecorder(canvasStream);
        } catch (e) {
          mediaRecorder = new MediaRecorder(canvasStream);
        }

        mediaRecorder.ondataavailable = e => { 
          if (e.data && e.data.size > 0) recordedChunks.push(e.data); 
        };

        mediaRecorder.onstop = async () => {
          const isMp4 = mimeType.includes('mp4');
          const ext = isMp4 ? 'mp4' : 'webm';
          const typeMimeFinal = isMp4 ? 'video/mp4' : 'video/webm';

          const blob = new Blob(recordedChunks, { type: typeMimeFinal });
          const file = new File([blob], `mueseum-video-${Date.now()}.${ext}`, { type: typeMimeFinal });

          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            try {
              await navigator.share({
                files: [file],
                title: 'Vidéo MUE.SÉUM',
                text: 'Découvre mon voyage dans le temps !'
              });
            } catch (err) {
              console.log("Partage vidéo annulé");
            }
          } else {
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `mueseum-video.${ext}`;
            a.click();
          }
        };

        mediaRecorder.start();
        isRecording = true;
        btnRec.textContent = "⏹ Arrêter";
        btnRec.classList.add('recording');
      }
    }
  </script>
</body>
</html>
