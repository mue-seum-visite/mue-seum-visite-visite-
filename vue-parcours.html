<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Découverte du parcours - MUE.SÉUM</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    .header {
      padding: 15px;
      background-color: #1e1e1e;
      border-bottom: 1px solid #2a2a2a;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn-back {
      background-color: #d4af37;
      color: #000;
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 15px;
      font-weight: bold;
      font-size: 0.85rem;
    }
    .title {
      font-size: 1.1rem;
      font-weight: bold;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #map {
      flex: 1;
      width: 100%;
    }

    .popup-content {
      text-align: center;
      color: #000;
      padding: 4px;
    }
    .btn-ar {
      background-color: #d4af37;
      color: #000;
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 6px;
    }
    
    #ar-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 9999;
    }
    
    /* Vue Caméra en direct */
    #camera-feed {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    /* Rendus Canvas et aperçu vidéo */
    #ar-canvas-render {
      display: none;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #video-overlay {
      position: absolute;
      top: 70px;
      left: 20px;
      width: 120px;
      height: 160px;
      border-radius: 12px;
      border: 2px solid #d4af37;
      object-fit: cover;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      z-index: 10000;
    }

    .btn-close-ar {
      position: absolute;
      top: calc(20px + env(safe-area-inset-top));
      right: 20px;
      background: rgba(0,0,0,0.8);
      color: #fff;
      border: 1px solid #d4af37;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      z-index: 10001;
      cursor: pointer;
    }

    .ar-controls {
      position: absolute;
      bottom: calc(40px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 10001;
      background: rgba(0, 0, 0, 0.65);
      padding: 10px 18px;
      border-radius: 40px;
      backdrop-filter: blur(8px);
    }

    .btn-capture {
      background-color: #d4af37;
      color: #000;
      border: none;
      padding: 12px 18px;
      border-radius: 25px;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    #loading-badge {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.85);
      color: #d4af37;
      padding: 15px 25px;
      border-radius: 15px;
      border: 1px solid #d4af37;
      font-weight: bold;
      z-index: 10002;
    }
  </style>
</head>
<body>

  <div class="header">
    <a href="index.html" class="btn-back">⬅ Accueil</a>
    <h1 id="parcours-title" class="title">Chargement...</h1>
  </div>

  <div id="map"></div>

  <div id="ar-overlay">
    <button class="btn-close-ar" onclick="fermerCamera()">❌ Fermer</button>
    
    <video id="camera-feed" autoplay playsinline muted></video>
    <canvas id="ar-canvas-render"></canvas>

    <video id="video-overlay" autoplay loop muted playsinline crossorigin="anonymous"></video>

    <div id="loading-badge">⏳ Traitement de la photo...</div>

    <div class="ar-controls">
      <button class="btn-capture" id="btn-main" onclick="capturerPhotobooth()">📸 Capturer Photo</button>
      <button class="btn-capture" id="btn-retry" onclick="reprendrePhoto()" style="display: none;">🔄 Reprendre</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const parcoursId = urlParams.get('id');

    let selfieSegmentation;
    let cameraStream = null;
    let photoPrise = false;

    if (!parcoursId) {
      document.getElementById('parcours-title').textContent = "Parcours introuvable";
    } else {
      fetch(`parcours-${parcoursId}.json`)
        .then(res => res.json())
        .then(data => {
          document.getElementById('parcours-title').textContent = data.titre;
          initialiserCarte(data.points);
        })
        .catch(() => {
          document.getElementById('parcours-title').textContent = "Erreur de chargement";
        });
    }

    function initialiserCarte(points) {
      if (!points || points.length === 0) return;

      const map = L.map('map').setView([points[0].lat, points[0].lng], 14);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      }).addTo(map);

      const coordonnees = [];

      points.forEach(pt => {
        const titreAnim = pt.titre_animation || pt.nom;
        const contenuPopup = `
          <div class="popup-content">
            <b>${pt.nom}</b><br>
            <p style="margin: 4px 0; font-size: 0.85rem;">${titreAnim}</p>
            <button class="btn-ar" onclick="lancerExperience('${pt.video}')"> Lancer l'expérience</button>
          </div>
        `;

        L.marker([pt.lat, pt.lng]).addTo(map).bindPopup(contenuPopup);
        coordonnees.push([pt.lat, pt.lng]);
      });

      if (coordonnees.length > 1) {
        map.fitBounds(coordonnees, { padding: [30, 30] });
      }
    }

    function initialiserIA() {
      selfieSegmentation = new SelfieSegmentation({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
      });

      selfieSegmentation.setOptions({
        modelSelection: 1, // Modèle haute précision
      });
    }

    async function lancerExperience(videoUrl) {
      const arOverlay = document.getElementById('ar-overlay');
      const cameraFeed = document.getElementById('camera-feed');
      const videoOverlay = document.getElementById('video-overlay');

      if (!selfieSegmentation) initialiserIA();
      reprendrePhoto();

      videoOverlay.src = videoUrl;
      videoOverlay.muted = true;
      videoOverlay.currentTime = 0;
      videoOverlay.play().catch(() => {});

      arOverlay.style.display = 'block';

      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        cameraFeed.srcObject = cameraStream;
      } catch (e) {
        alert("Impossible d'accéder à la caméra.");
      }
    }

    function fermerCamera() {
      const arOverlay = document.getElementById('ar-overlay');
      const videoOverlay = document.getElementById('video-overlay');

      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }
      videoOverlay.pause();
      arOverlay.style.display = 'none';
    }

    async function capturerPhotobooth() {
      const cameraFeed = document.getElementById('camera-feed');
      const renderCanvas = document.getElementById('ar-canvas-render');
      const videoOverlay = document.getElementById('video-overlay');
      const btnMain = document.getElementById('btn-main');
      const btnRetry = document.getElementById('btn-retry');
      const badge = document.getElementById('loading-badge');

      if (photoPrise) {
        partagerPhoto();
        return;
      }

      badge.style.display = 'block';

      // Capture de la trame de la caméra
      const snapCanvas = document.createElement('canvas');
      snapCanvas.width = cameraFeed.videoWidth || 1280;
      snapCanvas.height = cameraFeed.videoHeight || 720;
      const snapCtx = snapCanvas.getContext('2d');
      snapCtx.drawImage(cameraFeed, 0, 0, snapCanvas.width, snapCanvas.height);

      // Exécution unique du détourage IA
      selfieSegmentation.onResults((results) => {
        renderCanvas.width = snapCanvas.width;
        renderCanvas.height = snapCanvas.height;
        const ctx = renderCanvas.getContext('2d');

        ctx.save();
        ctx.clearRect(0, 0, renderCanvas.width, renderCanvas.height);

        // 1. Fond : Décor vidéo ou fond sombre
        if (videoOverlay && videoOverlay.readyState >= 2) {
          ctx.drawImage(videoOverlay, 0, 0, renderCanvas.width, renderCanvas.height);
        } else {
          ctx.fillStyle = "#111111";
          ctx.fillRect(0, 0, renderCanvas.width, renderCanvas.height);
        }

        // 2. Premier plan : Silhouette découpée
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = renderCanvas.width;
        tempCanvas.height = renderCanvas.height;
        const tempCtx = tempCanvas.getContext('2d');

        tempCtx.drawImage(results.segmentationMask, 0, 0, renderCanvas.width, renderCanvas.height);
        tempCtx.globalCompositeOperation = 'source-in';

        // Effet miroir sur l'utilisateur
        tempCtx.translate(renderCanvas.width, 0);
        tempCtx.scale(-1, 1);
        tempCtx.drawImage(results.image, 0, 0, renderCanvas.width, renderCanvas.height);

        ctx.drawImage(tempCanvas, 0, 0);
        ctx.restore();

        // Basculer l'affichage
        cameraFeed.style.display = 'none';
        videoOverlay.style.display = 'none';
        renderCanvas.style.display = 'block';
        badge.style.display = 'none';

        photoPrise = true;
        btnMain.textContent = "💾 Télécharger / Partager";
        btnMain.style.backgroundColor = "#4CAF50";
        btnMain.style.color = "#ffffff";
        btnRetry.style.display = "inline-block";
      });

      await selfieSegmentation.send({ image: snapCanvas });
    }

    function reprendrePhoto() {
      const cameraFeed = document.getElementById('camera-feed');
      const renderCanvas = document.getElementById('ar-canvas-render');
      const videoOverlay = document.getElementById('video-overlay');
      const btnMain = document.getElementById('btn-main');
      const btnRetry = document.getElementById('btn-retry');

      photoPrise = false;
      renderCanvas.style.display = 'none';
      cameraFeed.style.display = 'block';
      videoOverlay.style.display = 'block';

      btnMain.textContent = "📸 Capturer Photo";
      btnMain.style.backgroundColor = "#d4af37";
      btnMain.style.color = "#000000";
      btnRetry.style.display = "none";
    }

    function partagerPhoto() {
      const renderCanvas = document.getElementById('ar-canvas-render');

      renderCanvas.toBlob(async (blob) => {
        if (!blob) return;
        const file = new File([blob], `mueseum-souvenir-${Date.now()}.png`, { type: 'image/png' });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({
              files: [file],
              title: 'Mon souvenir MUE.SÉUM',
              text: 'Voici ma capture en réalité augmentée !'
            });
          } catch (err) {}
        } else {
          const imageURL = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = imageURL;
          link.download = `mueseum-souvenir.png`;
          link.click();
        }
      }, 'image/png');
    }
  </script>

</body>
</html>
