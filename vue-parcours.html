<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Découverte du parcours - MUE.SÉUM</title>
  <!-- Feuilles de style pour la carte Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    .header {
      padding: 15px;
      background-color: #1e1e1e;
      border-bottom: 1px solid #2a2a2a;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn-back {
      background-color: #d4af37;
      color: #000;
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 15px;
      font-weight: bold;
      font-size: 0.85rem;
    }
    .title {
      font-size: 1.1rem;
      font-weight: bold;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #map {
      flex: 1;
      width: 100%;
    }

    /* Styles indispensables pour l'affichage Caméra + Vidéo Plein Écran */
    .popup-content {
      text-align: center;
      color: #000;
      padding: 4px;
    }
    .btn-ar {
      background-color: #d4af37;
      color: #000;
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 6px;
    }
    #ar-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 9999;
    }
    #camera-feed {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #video-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover; /* MODIFICATION : prend l'entièreté de l'écran du GSM */
      opacity: 0.7;
      pointer-events: none;
    }
    .btn-close-ar {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(0,0,0,0.8);
      color: #fff;
      border: 1px solid #d4af37;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      z-index: 10000;
      cursor: pointer;
    }

    /* AJOUT : Contrôles de capture superposés */
    .ar-controls {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 15px;
      z-index: 10000;
    }
    .btn-capture {
      background-color: #d4af37;
      color: #000;
      border: 2px solid #fff;
      padding: 12px 20px;
      border-radius: 30px;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <div class="header">
    <a href="index.html" class="btn-back">⬅ Accueil</a>
    <h1 id="parcours-title" class="title">Chargement...</h1>
  </div>

  <div id="map"></div>

  <!-- Conteneur plein écran : Caméra du GSM + Animation vidéo transparente -->
  <div id="ar-overlay">
    <button class="btn-close-ar" onclick="fermerCamera()">❌ Fermer</button>
    <video id="camera-feed" autoplay playsinline muted></video>
    <video id="video-overlay" autoplay loop muted playsinline></video>

    <!-- AJOUT : Boutons Photo et Filmer pendant l'expérience -->
    <div class="ar-controls">
      <button class="btn-capture" onclick="prendrePhoto()">📸 Photo</button>
      <button class="btn-capture" id="btn-record" onclick="toggleVideo()">🔴 Filmer</button>
    </div>
  </div>

  <!-- AJOUT : Canvas invisible servant de support pour la capture de photo -->
  <canvas id="capture-canvas" style="display:none;"></canvas>

  <!-- Script Leaflet pour générer la carte -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Récupère l'ID transmis dans l'URL (ex: ?id=1 ou ?id=36)
    const urlParams = new URLSearchParams(window.location.search);
    const parcoursId = urlParams.get('id');

    // AJOUT : Variables globales pour l'enregistrement vidéo
    let mediaRecorder;
    let recordedChunks = [];

    if (!parcoursId) {
      document.getElementById('parcours-title').textContent = "Parcours introuvable";
    } else {
      // Lit automatiquement le JSON correspondant sans coder de lieu en dur
      fetch(`parcours-${parcoursId}.json`)
        .then(res => res.json())
        .then(data => {
          document.getElementById('parcours-title').textContent = data.titre;
          initialiserCarte(data.points);
        })
        .catch(() => {
          document.getElementById('parcours-title').textContent = "Erreur de chargement";
        });
    }

    function initialiserCarte(points) {
      if (!points || points.length === 0) return;

      // Centre initialement la carte sur le 1er point
      const map = L.map('map').setView([points[0].lat, points[0].lng], 14);

      // Fond de carte sombre gratuit
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      }).addTo(map);

      const coordonnees = [];

      // Place les repères spécifiques au JSON chargé
      points.forEach(pt => {
        const titreAnim = pt.titre_animation || pt.nom;
        const contenuPopup = `
          <div class="popup-content">
            <b>${pt.nom}</b><br>
            <p style="margin: 4px 0; font-size: 0.85rem;">${titreAnim}</p>
            <button class="btn-ar" onclick="lancerExperience('${pt.video}')">📸 Lancer l'expérience</button>
          </div>
        `;

        L.marker([pt.lat, pt.lng]).addTo(map)
          .bindPopup(contenuPopup);
        coordonnees.push([pt.lat, pt.lng]);
      });

      // Cadre la carte pour afficher tous les points du parcours
      if (coordonnees.length > 1) {
        map.fitBounds(coordonnees, { padding: [30, 30] });
      }
    }

    // Activer la caméra arrière du smartphone et afficher la vidéo transparente en superposition
    function lancerExperience(videoUrl) {
      const arOverlay = document.getElementById('ar-overlay');
      const cameraFeed = document.getElementById('camera-feed');
      const videoOverlay = document.getElementById('video-overlay');

      videoOverlay.src = videoUrl;

      navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
        .then(stream => {
          cameraFeed.srcObject = stream;
          arOverlay.style.display = 'block';
        })
        .catch(err => {
          alert("Erreur d'accès à la caméra : " + err);
        });
    }

    function fermerCamera() {
      const arOverlay = document.getElementById('ar-overlay');
      const cameraFeed = document.getElementById('camera-feed');
      
      if (cameraFeed.srcObject) {
        cameraFeed.srcObject.getTracks().forEach(track => track.stop());
      }
      arOverlay.style.display = 'none';
    }

    // AJOUT : Capture de photo assemblée en direct
    function prendrePhoto() {
      const cameraFeed = document.getElementById('camera-feed');
      const videoOverlay = document.getElementById('video-overlay');
      const canvas = document.getElementById('capture-canvas');
      const ctx = canvas.getContext('2d');

      canvas.width = cameraFeed.videoWidth || window.innerWidth;
      canvas.height = cameraFeed.videoHeight || window.innerHeight;

      ctx.drawImage(cameraFeed, 0, 0, canvas.width, canvas.height);
      ctx.globalAlpha = 0.7;
      ctx.drawImage(videoOverlay, 0, 0, canvas.width, canvas.height);

      const imageURL = canvas.toDataURL('image/png');
      const link = document.createElement('a');
      link.href = imageURL;
      link.download = `mueseum-photo.png`;
      link.click();
    }

    // AJOUT : Capture d'enregistrement vidéo
    function toggleVideo() {
      const btnRecord = document.getElementById('btn-record');
      const cameraFeed = document.getElementById('camera-feed');

      if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
        btnRecord.textContent = "🔴 Filmer";
        btnRecord.style.backgroundColor = "#d4af37";
      } else {
        recordedChunks = [];
        const stream = cameraFeed.srcObject;
        mediaRecorder = new MediaRecorder(stream);

        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: "video/mp4" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `mueseum-video.mp4`;
          a.click();
        };

        mediaRecorder.start();
        btnRecord.textContent = "⏹️ Arrêter";
        btnRecord.style.backgroundColor = "#ff4444";
      }
    }
  </script>

</body>
</html>
