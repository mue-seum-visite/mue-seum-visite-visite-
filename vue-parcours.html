<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Découverte du parcours - MUE.SÉUM</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    .header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 15px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 10;
    }
    .btn-back {
      background-color: #d4af37;
      color: #000;
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.85rem;
    }
    .title {
      font-size: 1.05rem;
      font-weight: bold;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #map {
      width: 100vw;
      height: 100vh;
    }

    .popup-content { text-align: center; color: #000; }
    .btn-ar {
      background-color: #d4af37;
      color: #000;
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 6px;
    }
    
    /* OVERLAY EXPÉRIENCE EN IMMERSION */
    #ar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 99999;
    }
    
    /* Décor historique */
    #video-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      filter: contrast(110%) brightness(95%);
    }

    /* Retour caméra selfie */
    #camera-feed {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: 2;
      opacity: 0.7;
    }

    /* Canvas de rendu final généré par l'IA */
    #ar-canvas-render {
      display: none;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 3;
    }

    .btn-close-ar {
      position: absolute;
      top: calc(20px + env(safe-area-inset-top));
      right: 20px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      border: 1px solid #d4af37;
      padding: 10px 18px;
      border-radius: 25px;
      font-weight: bold;
      z-index: 10;
      cursor: pointer;
    }

    .ar-controls {
      position: absolute;
      bottom: calc(35px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.75);
      padding: 12px 24px;
      border-radius: 40px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(212, 175, 55, 0.4);
    }

    .btn-capture {
      background-color: #d4af37;
      color: #000;
      border: none;
      padding: 12px 24px;
      border-radius: 25px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    #loader-badge {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.9);
      color: #d4af37;
      padding: 16px 28px;
      border-radius: 20px;
      border: 1px solid #d4af37;
      font-weight: bold;
      z-index: 11;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="header">
    <a href="index.html" class="btn-back">⬅ Accueil</a>
    <h1 id="parcours-title" class="title">Chargement...</h1>
  </div>

  <div id="map"></div>

  <div id="ar-overlay">
    <button class="btn-close-ar" onclick="fermerCamera()">❌ Fermer</button>
    
    <video id="video-overlay" autoplay loop muted playsinline crossorigin="anonymous"></video>
    <video id="camera-feed" autoplay playsinline muted></video>
    <canvas id="ar-canvas-render"></canvas>

    <div id="loader-badge">🤖 L'IA génère la fusion...</div>

    <div class="ar-controls">
      <button class="btn-capture" id="btn-main" onclick="capturerPhotobooth()">📸 Prendre le Selfie</button>
      <button class="btn-capture" id="btn-retry" onclick="reprendrePhoto()" style="display: none;">🔄 Reprendre</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Clé d'API gratuite Hugging Face configurée
    const API_KEY = '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';

    const urlParams = new URLSearchParams(window.location.search);
    const parcoursId = urlParams.get('id');

    let cameraStream = null;
    let photoPrise = false;

    if (!parcoursId) {
      document.getElementById('parcours-title').textContent = "Parcours introuvable";
    } else {
      fetch(`parcours-${parcoursId}.json`)
        .then(res => res.json())
        .then(data => {
          document.getElementById('parcours-title').textContent = data.titre;
          initialiserCarte(data.points);
        })
        .catch(() => {
          document.getElementById('parcours-title').textContent = "Erreur de chargement";
        });
    }

    function initialiserCarte(points) {
      if (!points || points.length === 0) return;

      const map = L.map('map').setView([points[0].lat, points[0].lng], 14);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      }).addTo(map);

      points.forEach(pt => {
        const titreAnim = pt.titre_animation || pt.nom;
        const contenuPopup = `
          <div class="popup-content">
            <b>${pt.nom}</b><br>
            <p style="margin: 4px 0; font-size: 0.85rem;">${titreAnim}</p>
            <button class="btn-ar" onclick="lancerExperience('${pt.video}')">🚀 Entrer dans l'époque</button>
          </div>
        `;

        L.marker([pt.lat, pt.lng]).addTo(map).bindPopup(contenuPopup);
      });
    }

    async function lancerExperience(videoUrl) {
      const arOverlay = document.getElementById('ar-overlay');
      const cameraFeed = document.getElementById('camera-feed');
      const videoOverlay = document.getElementById('video-overlay');

      reprendrePhoto();

      videoOverlay.src = videoUrl;
      videoOverlay.muted = true;
      videoOverlay.currentTime = 0;
      videoOverlay.play().catch(() => {});

      arOverlay.style.display = 'block';

      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        cameraFeed.srcObject = cameraStream;
      } catch (e) {
        alert("Accès caméra refusé.");
      }
    }

    function fermerCamera() {
      const arOverlay = document.getElementById('ar-overlay');
      const videoOverlay = document.getElementById('video-overlay');

      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }
      videoOverlay.pause();
      arOverlay.style.display = 'none';
    }

    async function capturerPhotobooth() {
      const cameraFeed = document.getElementById('camera-feed');
      const renderCanvas = document.getElementById('ar-canvas-render');
      const videoOverlay = document.getElementById('video-overlay');
      const btnMain = document.getElementById('btn-main');
      const btnRetry = document.getElementById('btn-retry');
      const badge = document.getElementById('loader-badge');

      if (photoPrise) {
        partagerPhoto();
        return;
      }

      badge.style.display = 'block';

      const snapCanvas = document.createElement('canvas');
      snapCanvas.width = cameraFeed.videoWidth || 1280;
      snapCanvas.height = cameraFeed.videoHeight || 720;
      const snapCtx = snapCanvas.getContext('2d');
      
      snapCtx.translate(snapCanvas.width, 0);
      snapCtx.scale(-1, 1);
      snapCtx.drawImage(cameraFeed, 0, 0, snapCanvas.width, snapCanvas.height);

      snapCanvas.toBlob(async (blob) => {
        try {
          // Déblocage CORS avec corsproxy.io
          const targetUrl = "https://api-inference.huggingface.co/models/briaai/RMBG-1.4";
          const response = await fetch("https://corsproxy.io/?" + encodeURIComponent(targetUrl), {
            method: "POST",
            headers: {
              "Authorization": `Bearer ${API_KEY}`,
              "Content-Type": "application/octet-stream"
            },
            body: blob
          });

          if (!response.ok) {
            throw new Error('Erreur API Hugging Face: ' + response.status);
          }

          const resultBlob = await response.blob();
          const personImg = new Image();
          personImg.src = URL.createObjectURL(resultBlob);

          personImg.onload = () => {
            renderCanvas.width = snapCanvas.width;
            renderCanvas.height = snapCanvas.height;
            const ctx = renderCanvas.getContext('2d');

            ctx.save();
            ctx.clearRect(0, 0, renderCanvas.width, renderCanvas.height);

            if (videoOverlay && videoOverlay.readyState >= 2) {
              ctx.filter = "contrast(110%) brightness(95%)";
              ctx.drawImage(videoOverlay, 0, 0, renderCanvas.width, renderCanvas.height);
              ctx.filter = "none";
            } else {
              ctx.fillStyle = "#111111";
              ctx.fillRect(0, 0, renderCanvas.width, renderCanvas.height);
            }

            ctx.filter = "contrast(105%) brightness(98%)";
            ctx.drawImage(personImg, 0, 0, renderCanvas.width, renderCanvas.height);
            ctx.filter = "none";

            ctx.restore();

            cameraFeed.style.display = 'none';
            videoOverlay.style.display = 'none';
            renderCanvas.style.display = 'block';
            badge.style.display = 'none';

            photoPrise = true;
            btnMain.textContent = "💾 Enregistrer / Partager";
            btnMain.style.backgroundColor = "#4CAF50";
            btnMain.style.color = "#ffffff";
            btnRetry.style.display = "inline-block";
          };

        } catch (error) {
          alert("Erreur lors de la génération. Détails: " + error.message);
          badge.style.display = 'none';
        }
      }, 'image/jpeg', 0.95);
    }

    function reprendrePhoto() {
      const cameraFeed = document.getElementById('camera-feed');
      const renderCanvas = document.getElementById('ar-canvas-render');
      const videoOverlay = document.getElementById('video-overlay');
      const btnMain = document.getElementById('btn-main');
      const btnRetry = document.getElementById('btn-retry');

      photoPrise = false;
      renderCanvas.style.display = 'none';
      cameraFeed.style.display = 'block';
      videoOverlay.style.display = 'block';

      btnMain.textContent = "📸 Prendre le Selfie";
      btnMain.style.backgroundColor = "#d4af37";
      btnMain.style.color = "#000000";
      btnRetry.style.display = "none";
    }

    function partagerPhoto() {
      const renderCanvas = document.getElementById('ar-canvas-render');

      renderCanvas.toBlob(async (blob) => {
        if (!blob) return;
        const file = new File([blob], `mueseum-souvenir-${Date.now()}.png`, { type: 'image/png' });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({
              files: [file],
              title: 'Mon souvenir MUE.SÉUM',
              text: 'Voici ma photo dans le Charleroi d\'époque !'
            });
          } catch (err) {}
        } else {
          const imageURL = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = imageURL;
          link.download = `mueseum-souvenir.png`;
          link.click();
        }
      }, 'image/png');
    }
  </script>

</body>
</html>
