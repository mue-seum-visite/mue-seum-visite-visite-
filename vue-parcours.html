<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Découverte du parcours - MUE.SÉUM</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.js" crossorigin="anonymous"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    .header {
      padding: 15px;
      background-color: #1e1e1e;
      border-bottom: 1px solid #2a2a2a;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn-back {
      background-color: #d4af37;
      color: #000;
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 15px;
      font-weight: bold;
      font-size: 0.85rem;
    }
    .title {
      font-size: 1.1rem;
      font-weight: bold;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #map {
      flex: 1;
      width: 100%;
    }

    .popup-content {
      text-align: center;
      color: #000;
      padding: 4px;
    }
    .btn-ar {
      background-color: #d4af37;
      color: #000;
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 6px;
    }
    .btn-ar:disabled {
      background-color: #555;
      color: #aaa;
      cursor: not-allowed;
    }
    #ar-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 9999;
    }
    
    #ar-canvas-render {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #camera-feed, #video-overlay {
      display: none;
    }

    .btn-close-ar {
      position: absolute;
      top: calc(20px + env(safe-area-inset-top));
      right: 20px;
      background: rgba(0,0,0,0.8);
      color: #fff;
      border: 1px solid #d4af37;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      z-index: 10000;
      cursor: pointer;
    }

    .ar-controls {
      position: absolute;
      bottom: calc(100px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 10000;
      background: rgba(0, 0, 0, 0.65);
      padding: 10px 18px;
      border-radius: 40px;
      backdrop-filter: blur(8px);
    }
    .btn-capture {
      background-color: #d4af37;
      color: #000;
      border: none;
      padding: 12px 18px;
      border-radius: 25px;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <div class="header">
    <a href="index.html" class="btn-back">⬅ Accueil</a>
    <h1 id="parcours-title" class="title">Chargement...</h1>
  </div>

  <div id="map"></div>

  <div id="ar-overlay">
    <button class="btn-close-ar" onclick="fermerCamera()">❌ Fermer</button>
    
    <canvas id="ar-canvas-render"></canvas>

    <video id="camera-feed" autoplay playsinline muted></video>
    <video id="video-overlay" autoplay loop muted playsinline crossorigin="anonymous"></video>

    <div class="ar-controls">
      <button class="btn-capture" onclick="prendrePhotoCombiner()">📸 Capturer Photo</button>
      <button class="btn-capture" id="btn-record" onclick="toggleEnregistrementCombiner()">🔴 Filmer la scène</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const parcoursId = urlParams.get('id');

    let mediaRecorder;
    let recordedChunks = [];
    let imageSegmenter = null;
    let streamCamera = null;
    let animFrameId = null;
    let isIaReady = false;

    if (!parcoursId) {
      document.getElementById('parcours-title').textContent = "Parcours introuvable";
    } else {
      fetch(`parcours-${parcoursId}.json`)
        .then(res => res.json())
        .then(data => {
          document.getElementById('parcours-title').textContent = data.titre;
          initialiserCarte(data.points);
        })
        .catch(() => {
          document.getElementById('parcours-title').textContent = "Erreur de chargement";
        });
    }

    function initialiserCarte(points) {
      if (!points || points.length === 0) return;

      const map = L.map('map').setView([points[0].lat, points[0].lng], 14);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      }).addTo(map);

      const coordonnees = [];

      points.forEach(pt => {
        const titreAnim = pt.titre_animation || pt.nom;
        const contenuPopup = `
          <div class="popup-content">
            <b>${pt.nom}</b><br>
            <p style="margin: 4px 0; font-size: 0.85rem;">${titreAnim}</p>
            <button class="btn-ar" id="btn-launch-ar" onclick="lancerExperience('${pt.video}')">
              ${isIaReady ? "📸 Lancer l'expérience" : "⏳ Chargement IA..."}
            </button>
          </div>
        `;

        L.marker([pt.lat, pt.lng]).addTo(map).bindPopup(contenuPopup);
        coordonnees.push([pt.lat, pt.lng]);
      });

      if (coordonnees.length > 1) {
        map.fitBounds(coordonnees, { padding: [30, 30] });
      }
    }

    // INITIALISATION ROBUSTE DE MEDIAPIPE VISION
    async function initialiserIAGoogle() {
      try {
        // Résolution de l'objet global exposé par le CDN
        const visionModule = window.tasksVision || window.Vision;

        if (!visionModule) {
          console.error("Le module Vision n'a pas pu être chargé depuis le CDN.");
          return;
        }

        const vision = await visionModule.FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
        );
        
        imageSegmenter = await visionModule.ImageSegmenter.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath: "https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite",
            delegate: "CPU"
          },
          runningMode: "VIDEO",
          outputCategoryMask: true,
          outputConfidenceMasks: false
        });

        isIaReady = true;
        
        // Mise à jour visuelle des boutons de carte si ouverts
        const btnAr = document.getElementById('btn-launch-ar');
        if (btnAr) {
          btnAr.textContent = "📸 Lancer l'expérience";
        }
      } catch (err) {
        console.error("Erreur critique d'initialisation du modèle IA:", err);
      }
    }
    
    // Lancement au chargement de la fenêtre
    window.addEventListener('load', initialiserIAGoogle);

    async function lancerExperience(videoUrl) {
      if (!isIaReady || !imageSegmenter) {
        alert("Le moteur IA est toujours en cours de téléchargement depuis le réseau. Réessayez dans un instant.");
        return;
      }

      const arOverlay = document.getElementById('ar-overlay');
      const cameraFeed = document.getElementById('camera-feed');
      const videoOverlay = document.getElementById('video-overlay');

      videoOverlay.src = videoUrl;
      videoOverlay.muted = true;
      videoOverlay.currentTime = 0;
      
      const playPromise = videoOverlay.play();
      if (playPromise !== undefined) {
        playPromise.catch(() => videoOverlay.play());
      }

      arOverlay.style.display = 'block';

      try {
        streamCamera = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" },
          audio: false
        });
        cameraFeed.srcObject = streamCamera;
        cameraFeed.onloadedmetadata = () => {
          cameraFeed.play();
          demarrerBoucleRendu();
        };
      } catch (e) {
        alert("Impossible d'accéder à la caméra. Autorisez l'accès à la caméra dans votre navigateur.");
      }
    }

    function fermerCamera() {
      const arOverlay = document.getElementById('ar-overlay');
      const videoOverlay = document.getElementById('video-overlay');

      if (animFrameId) cancelAnimationFrame(animFrameId);
      if (streamCamera) {
        streamCamera.getTracks().forEach(track => track.stop());
        streamCamera = null;
      }

      videoOverlay.pause();
      arOverlay.style.display = 'none';
    }

    function demarrerBoucleRendu() {
      const canvas = document.getElementById('ar-canvas-render');
      const ctx = canvas.getContext('2d');
      const cameraFeed = document.getElementById('camera-feed');
      const videoOverlay = document.getElementById('video-overlay');

      let lastStartTimeMs = -1;

      async function renderFrame() {
        if (cameraFeed.readyState >= 2 && cameraFeed.currentTime !== lastStartTimeMs && imageSegmenter) {
          lastStartTimeMs = cameraFeed.currentTime;
          
          canvas.width = cameraFeed.videoWidth || 1280;
          canvas.height = cameraFeed.videoHeight || 720;
          const w = canvas.width;
          const h = canvas.height;

          const startTimeMs = performance.now();
          imageSegmenter.segmentForVideo(cameraFeed, startTimeMs, (result) => {
            ctx.save();
            ctx.clearRect(0, 0, w, h);

            // 1. Décor d'époque
            if (videoOverlay && videoOverlay.readyState >= 2) {
              ctx.drawImage(videoOverlay, 0, 0, w, h);
            } else {
              ctx.fillStyle = "#111111";
              ctx.fillRect(0, 0, w, h);
            }

            // 2. Traitement du masque
            const mask = result.categoryMask;
            if (mask) {
              const maskArray = mask.getAsUint8Array();

              const maskCanvas = document.createElement('canvas');
              maskCanvas.width = mask.width;
              maskCanvas.height = mask.height;
              const maskCtx = maskCanvas.getContext('2d');
              const maskImgData = maskCtx.createImageData(mask.width, mask.height);

              for (let i = 0; i < maskArray.length; i++) {
                const isPerson = maskArray[i] !== 0;
                maskImgData.data[i * 4 + 3] = isPerson ? 255 : 0;
              }
              maskCtx.putImageData(maskImgData, 0, 0);

              // 3. Silhouette utilisateur
              const personCanvas = document.createElement('canvas');
              personCanvas.width = w;
              personCanvas.height = h;
              const personCtx = personCanvas.getContext('2d');

              personCtx.save();
              personCtx.translate(w, 0);
              personCtx.scale(-1, 1);
              personCtx.drawImage(cameraFeed, 0, 0, w, h);
              personCtx.restore();

              personCtx.globalCompositeOperation = 'destination-in';
              personCtx.filter = 'blur(2px)';
              personCtx.drawImage(maskCanvas, 0, 0, w, h);

              // 4. Composition finale
              ctx.drawImage(personCanvas, 0, 0);
            }
            ctx.restore();
          });
        }
        animFrameId = requestAnimationFrame(renderFrame);
      }
      renderFrame();
    }

    function prendrePhotoCombiner() {
      const renderCanvas = document.getElementById('ar-canvas-render');

      renderCanvas.toBlob(async (blob) => {
        if (!blob) return;
        const file = new File([blob], `mueseum-souvenir-${Date.now()}.png`, { type: 'image/png' });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({
              files: [file],
              title: 'Mon souvenir MUE.SÉUM',
              text: 'Voici ma capture en réalité augmentée !'
            });
          } catch (err) {
            console.log("Partage annulé");
          }
        } else {
          const imageURL = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = imageURL;
          link.download = `mueseum-souvenir.png`;
          link.click();
        }
      }, 'image/png');
    }

    function obtenirMimeTypeVideo() {
      const types = [
        'video/mp4;codecs=avc1',
        'video/mp4',
        'video/webm;codecs=vp9',
        'video/webm;codecs=vp8',
        'video/webm'
      ];
      for (let t of types) {
        if (MediaRecorder.isTypeSupported(t)) return t;
      }
      return '';
    }

    function toggleEnregistrementCombiner() {
      const btnRecord = document.getElementById('btn-record');
      const renderCanvas = document.getElementById('ar-canvas-render');

      if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
        btnRecord.textContent = "🔴 Filmer la scène";
        btnRecord.style.backgroundColor = "#d4af37";
      } else {
        recordedChunks = [];
        const mimeType = obtenirMimeTypeVideo();
        const canvasStream = renderCanvas.captureStream(25);

        try {
          mediaRecorder = mimeType ? new MediaRecorder(canvasStream, { mimeType }) : new MediaRecorder(canvasStream);
        } catch (e) {
          mediaRecorder = new MediaRecorder(canvasStream);
        }

        mediaRecorder.ondataavailable = e => { if (e.data && e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.onstop = async () => {
          const formatExtension = mimeType.includes('mp4') ? 'mp4' : 'webm';
          const typeMimeFinal = mimeType.includes('mp4') ? 'video/mp4' : 'video/webm';

          const blob = new Blob(recordedChunks, { type: typeMimeFinal });
          const file = new File([blob], `mueseum-video-${Date.now()}.${formatExtension}`, { type: typeMimeFinal });

          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            try {
              await navigator.share({
                files: [file],
                title: 'Vidéo MUE.SÉUM'
              });
            } catch (err) {
              console.log("Partage annulé");
            }
          } else {
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `mueseum-video.${formatExtension}`;
            a.click();
          }
        };

        mediaRecorder.start();
        btnRecord.textContent = "⏹️ Arrêter";
        btnRecord.style.backgroundColor = "#ff4444";
      }
    }
  </script>

</body>
</html>
