<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Découverte du parcours - MUE.SÉUM</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Chargement de MediaPipe Selfie Segmentation -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>

  <!-- Configuration et suivi unique de la durée de session GoatCounter -->
  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var id = params.get('id') || 'inconnu';
      var startTime = Date.now();
      var envoyed = false;

      window.goatcounter = {
        path: '/parcours-' + id,
        title: 'Parcours ' + id,
        allow_frame: true,
        allow_local: true
      };

      function enregistrerDureeTotale() {
        if (envoyed) return;
        envoyed = true;

        var dureeSec = Math.round((Date.now() - startTime) / 1000);
        
        if (navigator.sendBeacon) {
          var payload = {
            no_count: true,
            events: [{
              path: '/temps-parcours-' + id,
              title: 'Durée ' + dureeSec + 's (Parcours ' + id + ')',
              event: true
            }]
          };
          navigator.sendBeacon('https://mue-seum.goatcounter.com/count', JSON.stringify(payload));
        } else if (window.goatcounter && window.goatcounter.count) {
          window.goatcounter.count({
            path: '/temps-parcours-' + id,
            title: 'Durée ' + dureeSec + 's (Parcours ' + id + ')',
            event: true
          });
        }
      }

      document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'hidden') {
          enregistrerDureeTotale();
        }
      });
      window.addEventListener('pagehide', enregistrerDureeTotale);
    })();
  </script>
  <script data-goatcounter="https://mue-seum.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>

  <style>
- { box-sizing: border-box; }

      <button class="btn-capture" onclick="telechargerPhoto(); masquerGuidageRA();">📸 Photo</button>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const parcoursId = urlParams.get('id');

    let videoElement = document.getElementById('webcam-feed');
    let bgVideoElement = document.getElementById('background-video');
    let canvasElement = document.getElementById('ar-canvas');
    let ctx = canvasElement.getContext('2d');
    
    let cameraStream = null;
    let selfieSegmentation = null;
    let fondEpocheImg = new Image();
    let isBgVideo = false;
    let isProcessing = false;

    // Gestion enregistrement & partage vidéo
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;

    // Variables pour la géolocalisation et le guidage séquentiel
    let mapInstance = null;
    let userMarker = null;
    let isTracking = false;
    let markersList = [];
    let etapeCouranteIndex = 0;
    let parcoursTermine = false;

    const personCanvas = document.createElement('canvas');
    const pCtx = personCanvas.getContext('2d');

    function fermerBulleDepart() {
      const hint = document.getElementById('map-start-hint');
      if (hint) hint.style.display = 'none';
    }

    window.onpopstate = function(event) {
      const arOverlay = document.getElementById('ar-overlay');
      if (arOverlay && arOverlay.style.display === 'block') {
        fermerExperience();
      }
    };

    if (!parcoursId) {
      const titleEl = document.getElementById('parcours-title');
      if (titleEl) titleEl.textContent = "Parcours introuvable";
    } else {
      fetch(`parcours-${parcoursId}.json`)
        .then(res => res.json())
        .then(data => {
          const titleEl = document.getElementById('parcours-title');
          if (titleEl) titleEl.textContent = data.titre;
          initialiserCarte(data);
        })
        .catch(() => {
          const titleEl = document.getElementById('parcours-title');
          if (titleEl) titleEl.textContent = "Erreur de chargement";
        });
    }

    function calculerPositionFinaleDegagee(pointsExistants, traceExistante) {
      const dernierPoint = pointsExistants[pointsExistants.length - 1];
      const latRef = dernierPoint.lat;
      const lngRef = dernierPoint.lng;

      // Conversion d'environ 100 mètres en degrés selon la latitude
      const distanceMetres = 100;
      const deltaLat = distanceMetres / 111320;
      const deltaLng = distanceMetres / (111320 * Math.cos(latRef * Math.PI / 180));

      // Liste de tous les points existants et sommets du tracé à éviter
      const obstacles = pointsExistants.map(p => ({ lat: p.lat, lng: p.lng }));
      if (Array.isArray(traceExistante)) {
        traceExistante.forEach(coord => {
          if (Array.isArray(coord) && coord.length >= 2) {
            obstacles.push({ lat: coord[0], lng: coord[1] });
          }
        });
      }

      // Test de 16 directions autour du dernier point pour choisir la plus dégagée
      let meilleurePos = { lat: latRef - deltaLat, lng: lngRef + deltaLng };
      let meilleureDistanceMin = -1;

      for (let i = 0; i < 16; i++) {
        const angle = (i * 2 * Math.PI) / 16;
        const candLat = latRef + Math.sin(angle) * deltaLat;
        const candLng = lngRef + Math.cos(angle) * deltaLng;

        let distMin = Infinity;
        for (const obs of obstacles) {
          const dLat = (candLat - obs.lat) * 111320;
          const dLng = (candLng - obs.lng) * 111320 * Math.cos(latRef * Math.PI / 180);
          const dist = Math.hypot(dLat, dLng);
          if (dist < distMin) distMin = dist;
        }

        if (distMin > meilleureDistanceMin) {
          meilleureDistanceMin = distMin;
          meilleurePos = { lat: candLat, lng: candLng };
        }
      }

      return meilleurePos;
    }

    function initialiserCarte(data) {
      const points = [...(data.points || [])];
      if (points.length === 0) return;

      // Ajout automatique de la bulle supplémentaire "Me rendre à la balade" à ~100 m du dernier point, hors tracé
      let posFinaleAjoutee = null;
      if (data.gps && data.gps.trim() !== '') {
        posFinaleAjoutee = calculerPositionFinaleDegagee(points, data.trace);
        points.push({
          nom: "Me rendre à la balade",
          titre_animation: "Envie de vivre ce parcours sur place ? Lancez votre GPS pour rejoindre le point de départ.",
          lat: posFinaleAjoutee.lat,
          lng: posFinaleAjoutee.lng,
          video: "",
          isGpsFinal: true,
          gpsUrl: data.gps.trim()
        });
      }

      const map = L.map('map').setView([points[0].lat, points[0].lng], 15);
      mapInstance = map;

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      }).addTo(map);

      // Bouton fixe "Accueil"
      const backControl = L.control({ position: 'topleft' });
      backControl.onAdd = function() {
        const div = L.DomUtil.create('div', 'leaflet-bar leaflet-control');
        div.innerHTML = `
          <a id="btn-accueil-guide" href="index.html" style="
            background: #d4af37; 
            color: #000000; 
            text-decoration: none; 
            padding: 8px 14px; 
            display: inline-block;
            font-weight: bold; 
            font-size: 0.85rem;
            border-radius: 4px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
          ">⬅ Accueil</a>
        `;
        return div;
      };
      backControl.addTo(map);

      // Badge Titre en bas à gauche
      const titleControl = L.control({ position: 'bottomleft' });
      titleControl.onAdd = function() {
        const div = L.DomUtil.create('div', 'leaflet-bar leaflet-control');
        div.innerHTML = `
          <div id="parcours-title" style="
            background: rgba(0, 0, 0, 0.75); 
            color: #ffffff; 
            padding: 6px 12px; 
            font-weight: bold; 
            font-size: 0.9rem;
            border-radius: 4px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(212, 175, 55, 0.4);
            max-width: 250px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
          ">${data.titre || 'Chargement...'}</div>
        `;
        return div;
      };
      titleControl.addTo(map);

      // Dessin de la ligne du tracé si "trace" est présent
      if (data.trace && data.trace.length > 0) {
        const routePath = L.polyline(data.trace, {
          color: '#d4af37',
          weight: 4,
          opacity: 0.8,
          dashArray: '8, 8'
        }).addTo(map);

        const bounds = routePath.getBounds();
        if (posFinaleAjoutee) {
          bounds.extend([posFinaleAjoutee.lat, posFinaleAjoutee.lng]);
        }
        map.fitBounds(bounds, { padding: [40, 40] });
      } else if (points.length > 1) {
        const bounds = L.latLngBounds(points.map(p => [p.lat, p.lng]));
        map.fitBounds(bounds, { padding: [50, 50], maxZoom: 16 });
      }

      // Création des marqueurs numérotés 1, 2, 3...
      points.forEach((pt, index) => {
        const numero = index + 1;
        const titreAnim = pt.titre_animation || pt.nom;
        const avecSon = pt.avec_son ? true : false;
        
        let boutonHtml = '';
        if (pt.isGpsFinal && pt.gpsUrl) {
          boutonHtml = `<a href="${pt.gpsUrl}" target="_blank" class="btn-gps-final">📍 Me rendre à la balade</a>`;
        } else if (pt.video && pt.video.trim() !== '') {
          boutonHtml = `<button class="btn-ar" onclick="lancerExperience('${pt.video}', ${avecSon})">🚀 Entrer dans l'époque</button>`;
        }

        // Question de repérage sur le parcours uniquement dans le Point 1
        const questionSurPlaceHtml = (index === 0)
          ? `<div id="popup-gps-question" class="popup-gps-box">
               <div>📍 <b>Êtes-vous sur place ?</b></div>
               <div style="font-size: 0.74rem; color: #ccc; margin-top: 2px;">Afficher ma flèche rouge sur le tracé</div>
               <div class="popup-gps-actions">
                 <button class="btn-gps-no" onclick="repondreSurPlace(false)">Non</button>
                 <button class="btn-gps-yes" onclick="repondreSurPlace(true)">Oui</button>
               </div>
             </div>`
          : '';

        const contenuPopup = `
          <div class="popup-content">
            ${questionSurPlaceHtml}
            <b>${numero}. ${pt.nom}</b><br>
            <p style="margin: 4px 0; font-size: 0.85rem;">${titreAnim}</p>
            ${boutonHtml}
          </div>
        `;

        const numberIcon = L.divIcon({
          className: 'custom-num-marker',
          html: `<div class="marker-pin" id="marker-pin-${index}">${numero}</div>`,
          iconSize: [32, 32],
          iconAnchor: [16, 16],
          popupAnchor: [0, -16]
        });

        const marker = L.marker([pt.lat, pt.lng], { icon: numberIcon }).addTo(map).bindPopup(contenuPopup);
        markersList.push(marker);

        // Masque la bulle de départ dès l'ouverture d'un point et fait clignoter Accueil sur la dernière bulle
        marker.on('popupopen', function() {
          fermerBulleDepart();
          if (index === markersList.length - 1) {
            parcoursTermine = true;
            activerClignotementAccueil();
          }
        });

        // Quand on ferme un point, le point suivant prend le relais en doré — ou clignotement rouge d'Accueil à la fin
        marker.on('popupclose', function() {
          if (index === etapeCouranteIndex) {
            if (etapeCouranteIndex < markersList.length - 1) {
              etapeCouranteIndex++;
              mettreEnAvantPoint(etapeCouranteIndex, true);
            } else {
              parcoursTermine = true;
              activerClignotementAccueil();
            }
          }
        });
      });

      // Mettre en avant le Point 1 dès l'arrivée sur la carte
      setTimeout(() => mettreEnAvantPoint(0, false), 300);

      // Icône flèche rouge pour la position de l'utilisateur
      const redArrowIcon = L.divIcon({
        className: 'user-red-arrow-icon',
        html: `<div class="user-red-arrow">
                 <svg width="28" height="28" viewBox="0 0 24 24">
                   <path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z" fill="#ff2a2a" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round"/>
                 </svg>
               </div>`,
        iconSize: [30, 30],
        iconAnchor: [15, 15]
      });

      // Suivi de la position sur le parcours (flèche rouge)
      map.on('locationfound', function(e) {
        if (!userMarker) {
          userMarker = L.marker(e.latlng, { icon: redArrowIcon }).addTo(map).bindPopup("Vous êtes ici");
        } else {
          userMarker.setLatLng(e.latlng);
        }
      });

      map.on('locationerror', function() {
        alert("Impossible d'accéder à votre position. Vérifiez l'autorisation GPS de votre navigateur.");
      });
    }

    function activerClignotementAccueil() {
      document.querySelectorAll('.marker-pin').forEach(el => el.classList.remove('active-step'));
      const btnAccueil = document.getElementById('btn-accueil-guide');
      if (btnAccueil) {
        btnAccueil.classList.add('blink-accueil-red');
      }
    }

    function mettreEnAvantPoint(index, centrerCarte) {
      document.querySelectorAll('.marker-pin').forEach(el => el.classList.remove('active-step'));
      const pinEl = document.getElementById(`marker-pin-${index}`);
      if (pinEl) {
        pinEl.classList.add('active-step');
      }
      if (centrerCarte && mapInstance && markersList[index]) {
        mapInstance.panTo(markersList[index].getLatLng(), { animate: true });
      }
    }

    function repondreSurPlace(estSurPlace) {
      const box = document.getElementById('popup-gps-question');
      if (estSurPlace) {
        if (mapInstance && !isTracking) {
          mapInstance.locate({ setView: false, maxZoom: 17, watch: true, enableHighAccuracy: true });
          isTracking = true;
        }
        if (box) {
          box.innerHTML = `<div style="color: #d4af37; font-weight: bold;">✅ Flèche rouge activée sur le parcours</div>`;
        }
      } else {
        if (box) {
          box.style.display = 'none';
        }
      }
    }

    // GUIDAGE SPÉCIFIQUE À L'ÉCRAN DE RÉALITÉ AUGMENTÉE
    function afficherGuidageRA() {
      const arBubble = document.getElementById('ar-guide-bubble');
      const arControls = document.getElementById('ar-controls-bar');
      if (arBubble) arBubble.style.display = 'block';
      if (arControls) arControls.classList.add('highlight-guide');
    }

    function masquerGuidageRA() {
      const arBubble = document.getElementById('ar-guide-bubble');
      const arControls = document.getElementById('ar-controls-bar');
      if (arBubble) arBubble.style.display = 'none';
      if (arControls) arControls.classList.remove('highlight-guide');
    }

    async function lancerExperience(mediaUrl, avecSon = false) {
      const arOverlay = document.getElementById('ar-overlay');
      arOverlay.style.display = 'block';

      history.pushState({ arOuvert: true }, "");

      const urlPropre = mediaUrl.split('?')[0].toLowerCase();
      isBgVideo = urlPropre.endsWith('.mp4') || urlPropre.endsWith('.webm') || urlPropre.endsWith('.mov');

      if (isBgVideo) {
        bgVideoElement.src = mediaUrl;
        bgVideoElement.currentTime = 0;
        bgVideoElement.muted = !avecSon;

        try {
          await bgVideoElement.play();
        } catch (err) {
          console.log("Erreur lecture vidéo:", err);
        }
      } else {
        fondEpocheImg.crossOrigin = "anonymous";
        fondEpocheImg.src = mediaUrl;
      }

      if (!selfieSegmentation) {
        selfieSegmentation = new SelfieSegmentation({
          locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
        });

        selfieSegmentation.setOptions({
          modelSelection: 1,
          selfieMode: true
        });

        selfieSegmentation.onResults(onResults);
      }

      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        videoElement.srcObject = cameraStream;
        await videoElement.play();

        isProcessing = true;
        processVideo();

        afficherGuidageRA();
      } catch (err) {
        alert("Impossible d'accéder à la caméra : " + err.message);
      }
    }

    async function processVideo() {
      if (!isProcessing) return;
      if (videoElement.readyState >= 2) {
        await selfieSegmentation.send({ image: videoElement });
      }
      requestAnimationFrame(processVideo);
    }

    function onResults(results) {
      const w = results.image.width;
      const h = results.image.height;

      canvasElement.width = personCanvas.width = w;
      canvasElement.height = personCanvas.height = h;

      pCtx.save();
      pCtx.clearRect(0, 0, w, h);
      pCtx.drawImage(results.image, 0, 0, w, h);
      pCtx.globalCompositeOperation = 'destination-in';
      pCtx.filter = 'blur(4px)';
      pCtx.drawImage(results.segmentationMask, 0, 0, w, h);
      pCtx.restore();

      ctx.clearRect(0, 0, w, h);

      if (isBgVideo && bgVideoElement.readyState >= 2) {
        ctx.drawImage(bgVideoElement, 0, 0, w, h);
      } else if (!isBgVideo && fondEpocheImg.complete && fondEpocheImg.naturalWidth !== 0) {
        ctx.drawImage(fondEpocheImg, 0, 0, w, h);
      } else {
        ctx.fillStyle = "#111";
        ctx.fillRect(0, 0, w, h);
      }

      ctx.drawImage(personCanvas, 0, 0, w, h);

      const fontSize = Math.max(16, Math.round(w * 0.035));
      ctx.save();
      ctx.font = `bold ${fontSize}px -apple-system, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "bottom";

      ctx.shadowColor = "rgba(0, 0, 0, 0.8)";
      ctx.shadowBlur = 6;
      ctx.shadowOffsetX = 2;
      ctx.shadowOffsetY = 2;

      ctx.fillStyle = "#d4af37";
      ctx.fillText("✨ Souvenir MUE.SÉUM", w / 2, h - (h * 0.04));
      ctx.restore();
    }

    function fermerExperience() {
      isProcessing = false;
      masquerGuidageRA();
      if (isRecording) basculerEnregistrement();
      
      const arOverlay = document.getElementById('ar-overlay');
      if (bgVideoElement) bgVideoElement.pause();
      
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }
      arOverlay.style.display = 'none';

      if (parcoursTermine) {
        activerClignotementAccueil();
      }
    }

    function telechargerPhoto() {
      canvasElement.toBlob(async (blob) => {
        if (!blob) return;
        const file = new File([blob], `mueseum-photo-${Date.now()}.png`, { type: 'image/png' });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({
              files: [file],
              title: 'Souvenir MUE.SÉUM',
              text: 'Regarde ma photo dans le temps !'
            });
          } catch (e) {}
        } else {
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = `mueseum-souvenir.png`;
          a.click();
        }
      }, 'image/png');
    }

    function obtenirMimeTypeVideo() {
      const types = [
        'video/mp4;codecs=avc1',
        'video/mp4',
        'video/webm;codecs=vp9',
        'video/webm;codecs=vp8',
        'video/webm'
      ];
      for (let t of types) {
        if (MediaRecorder.isTypeSupported(t)) return t;
      }
      return '';
    }

    async function basculerEnregistrement() {
      const btnRec = document.getElementById('btn-rec');
      
      if (isRecording) {
        mediaRecorder.stop();
        isRecording = false;
        btnRec.textContent = "🎥 Filmer";
        btnRec.classList.remove('recording');
      } else {
        recordedChunks = [];
        const mimeType = obtenirMimeTypeVideo();
        const canvasStream = canvasElement.captureStream(30);

        try {
          const audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          if (audioStream && audioStream.getAudioTracks().length > 0) {
            canvasStream.addTrack(audioStream.getAudioTracks()[0]);
          }
        } catch (audioErr) {
          console.log("Audio non disponible ou refusé, enregistrement vidéo seul :", audioErr);
        }

        try {
          mediaRecorder = mimeType ? new MediaRecorder(canvasStream, { mimeType }) : new MediaRecorder(canvasStream);
        } catch (e) {
          mediaRecorder = new MediaRecorder(canvasStream);
        }

        mediaRecorder.ondataavailable = e => { 
          if (e.data && e.data.size > 0) recordedChunks.push(e.data); 
        };

        mediaRecorder.onstop = async () => {
          const isMp4 = mimeType.includes('mp4');
          const ext = isMp4 ? 'mp4' : 'webm';
          const typeMimeFinal = isMp4 ? 'video/mp4' : 'video/webm';

          const blob = new Blob(recordedChunks, { type: typeMimeFinal });
          const file = new File([blob], `mueseum-video-${Date.now()}.${ext}`, { type: typeMimeFinal });

          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            try {
              await navigator.share({
                files: [file],
                title: 'Vidéo MUE.SÉUM',
                text: 'Découvre mon voyage dans le temps !'
              });
            } catch (err) {
              console.log("Partage vidéo annulé");
            }
          } else {
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `mueseum-video.${ext}`;
            a.click();
          }
        };

        mediaRecorder.start();
        isRecording = true;
        btnRec.textContent = "⏹ Arrêter";
        btnRec.classList.add('recording');
      }
    }
  </script>
