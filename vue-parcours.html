<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Découverte du parcours - MUE.SÉUM</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    .header {
      padding: 15px;
      background-color: #1e1e1e;
      border-bottom: 1px solid #2a2a2a;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn-back {
      background-color: #d4af37;
      color: #000;
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 15px;
      font-weight: bold;
      font-size: 0.85rem;
    }
    .title {
      font-size: 1.1rem;
      font-weight: bold;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #map {
      flex: 1;
      width: 100%;
    }

    .popup-content {
      text-align: center;
      color: #000;
      padding: 4px;
    }
    .btn-ar {
      background-color: #d4af37;
      color: #000;
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 6px;
    }
    
    #ar-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 9999;
    }
    
    #camera-feed {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    #ar-canvas-render {
      display: none;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #video-overlay {
      display: none;
    }

    .btn-close-ar {
      position: absolute;
      top: calc(20px + env(safe-area-inset-top));
      right: 20px;
      background: rgba(0,0,0,0.8);
      color: #fff;
      border: 1px solid #d4af37;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      z-index: 10000;
      cursor: pointer;
    }

    .ar-controls {
      position: absolute;
      bottom: calc(40px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 10000;
      background: rgba(0, 0, 0, 0.65);
      padding: 10px 18px;
      border-radius: 40px;
      backdrop-filter: blur(8px);
    }
    .btn-capture {
      background-color: #d4af37;
      color: #000;
      border: none;
      padding: 12px 20px;
      border-radius: 25px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    #loader-overlay {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.85);
      padding: 20px 30px;
      border-radius: 20px;
      border: 1px solid #d4af37;
      text-align: center;
      z-index: 10001;
    }
  </style>
</head>
<body>

  <div class="header">
    <a href="index.html" class="btn-back">⬅ Accueil</a>
    <h1 id="parcours-title" class="title">Chargement...</h1>
  </div>

  <div id="map"></div>

  <div id="ar-overlay">
    <button class="btn-close-ar" onclick="fermerCamera()">❌ Fermer</button>

    <video id="camera-feed" autoplay playsinline muted></video>
    <canvas id="ar-canvas-render"></canvas>
    <video id="video-overlay" autoplay loop muted playsinline crossorigin="anonymous"></video>

    <div id="loader-overlay">
      <p style="margin: 0; font-weight: bold;">⏳ Détourage du souvenir...</p>
    </div>

    <div class="ar-controls">
      <button class="btn-capture" id="btn-action" onclick="capturerPhotobooth()">📸 Prendre la Photo</button>
      <button class="btn-capture" id="btn-retry" onclick="reprendrePhoto()" style="display: none;">🔄 Reprendre</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const parcoursId = urlParams.get('id');

    let streamCamera = null;
    let selfieSegmentation = null;
    let photoCapturee = false;

    if (!parcoursId) {
      document.getElementById('parcours-title').textContent = "Parcours introuvable";
    } else {
      fetch(`parcours-${parcoursId}.json`)
        .then(res => res.json())
        .then(data => {
          document.getElementById('parcours-title').textContent = data.titre;
          initialiserCarte(data.points);
        })
        .catch(() => {
          document.getElementById('parcours-title').textContent = "Erreur de chargement";
        });
    }

    function initialiserCarte(points) {
      if (!points || points.length === 0) return;

      const map = L.map('map').setView([points[0].lat, points[0].lng], 14);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      }).addTo(map);

      const coordonnees = [];

      points.forEach(pt => {
        const titreAnim = pt.titre_animation || pt.nom;
        const contenuPopup = `
          <div class="popup-content">
            <b>${pt.nom}</b><br>
            <p style="margin: 4px 0; font-size: 0.85rem;">${titreAnim}</p>
            <button class="btn-ar" onclick="lancerExperience('${pt.video}')">📸 Lancer le Photobooth</button>
          </div>
        `;

        L.marker([pt.lat, pt.lng]).addTo(map).bindPopup(contenuPopup);
        coordonnees.push([pt.lat, pt.lng]);
      });

      if (coordonnees.length > 1) {
        map.fitBounds(coordonnees, { padding: [30, 30] });
      }
    }

    function initialiserIA() {
      selfieSegmentation = new SelfieSegmentation({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
      });
      selfieSegmentation.setOptions({ modelSelection: 1 });
    }

    async function lancerExperience(videoUrl) {
      const arOverlay = document.getElementById('ar-overlay');
      const cameraFeed = document.getElementById('camera-feed');
      const videoOverlay = document.getElementById('video-overlay');

      if (!selfieSegmentation) initialiserIA();

      reprendrePhoto();

      videoOverlay.src = videoUrl;
      videoOverlay.muted = true;
      videoOverlay.currentTime = 0;
      videoOverlay.play().catch(() => {});

      arOverlay.style.display = 'block';

      try {
        streamCamera = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" },
          audio: false
        });
        cameraFeed.srcObject = streamCamera;
      } catch (e) {
        alert("Accès caméra refusé.");
      }
    }

    async function capturerPhotobooth() {
      const cameraFeed = document.getElementById('camera-feed');
      const canvasElement = document.getElementById('ar-canvas-render');
      const videoOverlay = document.getElementById('video-overlay');
      const btnAction = document.getElementById('btn-action');
      const btnRetry = document.getElementById('btn-retry');
      const loader = document.getElementById('loader-overlay');

      if (photoCapturee) {
        telechargerSouvenir();
        return;
      }

      loader.style.display = 'block';

      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = cameraFeed.videoWidth || 1280;
      tempCanvas.height = cameraFeed.videoHeight || 720;
      const tempCtx = tempCanvas.getContext('2d');
      tempCtx.drawImage(cameraFeed, 0, 0, tempCanvas.width, tempCanvas.height);

      selfieSegmentation.onResults((results) => {
        canvasElement.width = tempCanvas.width;
        canvasElement.height = tempCanvas.height;
        const ctx = canvasElement.getContext('2d');

        ctx.save();
        ctx.clearRect(0, 0, canvasElement.width, canvasElement.height);

        // 1. Appliquer le masque de la personne
        ctx.drawImage(results.segmentationMask, 0, 0, canvasElement.width, canvasElement.height);
        ctx.globalCompositeOperation = 'source-in';
        
        // Personne avec effet miroir
        ctx.translate(canvasElement.width, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
        ctx.restore();

        // 2. Dessiner la vidéo d'époque SOUS la personne
        ctx.save();
        ctx.globalCompositeOperation = 'destination-over';
        if (videoOverlay && videoOverlay.readyState >= 2 && !videoOverlay.paused) {
          ctx.drawImage(videoOverlay, 0, 0, canvasElement.width, canvasElement.height);
        } else {
          // Fond de secours si la vidéo du JSON est indisponible ou non chargée
          ctx.fillStyle = '#1e1e1e';
          ctx.fillRect(0, 0, canvasElement.width, canvasElement.height);
        }
        ctx.restore();

        // Afficher l'image traitée
        cameraFeed.style.display = 'none';
        canvasElement.style.display = 'block';
        loader.style.display = 'none';

        photoCapturee = true;
        btnAction.textContent = "💾 Enregistrer / Partager";
        btnAction.style.backgroundColor = "#4CAF50";
        btnAction.style.color = "#fff";
        btnRetry.style.display = "inline-block";
      });

      await selfieSegmentation.send({ image: tempCanvas });
    }

    function reprendrePhoto() {
      const cameraFeed = document.getElementById('camera-feed');
      const canvasElement = document.getElementById('ar-canvas-render');
      const btnAction = document.getElementById('btn-action');
      const btnRetry = document.getElementById('btn-retry');

      photoCapturee = false;
      canvasElement.style.display = 'none';
      cameraFeed.style.display = 'block';

      btnAction.textContent = "📸 Prendre la Photo";
      btnAction.style.backgroundColor = "#d4af37";
      btnAction.style.color = "#000";
      btnRetry.style.display = "none";
    }

    function telechargerSouvenir() {
      const canvasElement = document.getElementById('ar-canvas-render');

      canvasElement.toBlob(async (blob) => {
        if (!blob) return;
        const file = new File([blob], `mueseum-souvenir-${Date.now()}.png`, { type: 'image/png' });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({
              files: [file],
              title: 'Mon souvenir MUE.SÉUM',
              text: 'Voici ma photo en réalité augmentée !'
            });
          } catch (e) {}
        } else {
          const imageURL = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = imageURL;
          link.download = `mueseum-souvenir.png`;
          link.click();
        }
      }, 'image/png');
    }

    function fermerCamera() {
      const arOverlay = document.getElementById('ar-overlay');
      const videoOverlay = document.getElementById('video-overlay');

      if (streamCamera) {
        streamCamera.getTracks().forEach(track => track.stop());
        streamCamera = null;
      }

      videoOverlay.pause();
      arOverlay.style.display = 'none';
    }
  </script>

</body>
</html>
