<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Découverte du parcours - MUE.SÉUM</title>
  <!-- Feuilles de style pour la carte Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .header {
      padding: 15px;
      background-color: #1e1e1e;
      border-bottom: 1px solid #2a2a2a;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn-back {
      background-color: #d4af37;
      color: #000;
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 15px;
      font-weight: bold;
      font-size: 0.85rem;
    }
    .title {
      font-size: 1.1rem;
      font-weight: bold;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #map {
      flex: 1;
      width: 100%;
    }
    /* Styles ajoutés pour la vidéo transparente et le bouton caméra */
    .popup-content {
      text-align: center;
      color: #000;
    }
    .video-overlay {
      width: 100%;
      max-width: 240px;
      border-radius: 8px;
      opacity: 0.85;
      margin: 8px 0;
    }
    .btn-camera {
      display: inline-block;
      background-color: #d4af37;
      color: #000;
      padding: 8px 14px;
      border-radius: 20px;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.85rem;
      margin-top: 5px;
      cursor: pointer;
      border: none;
    }
    #camera-input {
      display: none;
    }
  </style>
</head>
<body>

  <div class="header">
    <a href="index.html" class="btn-back">⬅ Accueil</a>
    <h1 id="parcours-title" class="title">Chargement...</h1>
  </div>

  <div id="map"></div>

  <!-- Champ invisible pour ouvrir l'appareil photo/caméra du téléphone -->
  <input type="file" id="camera-input" accept="image/*,video/*" capture="environment">

  <!-- Script Leaflet pour générer la carte -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Récupère l'ID transmis dans l'URL (ex: ?id=1 ou ?id=36)
    const urlParams = new URLSearchParams(window.location.search);
    const parcoursId = urlParams.get('id');

    if (!parcoursId) {
      document.getElementById('parcours-title').textContent = "Parcours introuvable";
    } else {
      // Lit automatiquement le JSON correspondant sans coder de lieu en dur
      fetch(`parcours-${parcoursId}.json`)
        .then(res => res.json())
        .then(data => {
          document.getElementById('parcours-title').textContent = data.titre;
          initialiserCarte(data.points);
        })
        .catch(() => {
          document.getElementById('parcours-title').textContent = "Erreur de chargement";
        });
    }

    function ouvrirCamera() {
      document.getElementById('camera-input').click();
    }

    function initialiserCarte(points) {
      if (!points || points.length === 0) return;

      // Centre initialement la carte sur le 1er point
      const map = L.map('map').setView([points[0].lat, points[0].lng], 14);

      // Fond de carte sombre gratuit
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      }).addTo(map);

      const coordonnees = [];

      // Place les repères spécifiques au JSON chargé
      points.forEach(pt => {
        let contenuPopup = `<div class="popup-content"><b>${pt.nom}</b><br>`;
        
        if (pt.video) {
          contenuPopup += `<video class="video-overlay" controls autoplay loop muted playsinline src="${pt.video}"></video><br>`;
        }
        
        contenuPopup += `<button class="btn-camera" onclick="ouvrirCamera()">📸 Photo / Vidéo</button></div>`;

        L.marker([pt.lat, pt.lng]).addTo(map)
          .bindPopup(contenuPopup);
        
        coordonnees.push([pt.lat, pt.lng]);
      });

      // Cadre la carte pour afficher tous les points du parcours
      if (coordonnees.length > 1) {
        map.fitBounds(coordonnees, { padding: [30, 30] });
      }
    }
  </script>

</body>
</html>
