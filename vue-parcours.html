<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Découverte du parcours - MUE.SÉUM</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Chargement de MediaPipe Selfie Segmentation via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    .header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 15px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 10;
    }
    .btn-back {
      background-color: #d4af37;
      color: #000;
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.85rem;
    }
    .title {
      font-size: 1.05rem;
      font-weight: bold;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #map {
      width: 100vw;
      height: 100vh;
    }

    .popup-content { text-align: center; color: #000; }
    .btn-ar {
      background-color: #d4af37;
      color: #000;
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 6px;
    }
    
    #ar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 99999;
    }

    /* Le Canvas affiche le rendu composite final (Fond d'époque + Utilisateur détouré) */
    #ar-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 2;
    }

    /* La balise vidéo reste cachée en arrière-plan pour alimenter MediaPipe */
    #webcam-feed {
      display: none;
    }

    .btn-close-ar {
      position: absolute;
      top: calc(20px + env(safe-area-inset-top));
      right: 20px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      border: 1px solid #d4af37;
      padding: 10px 18px;
      border-radius: 25px;
      font-weight: bold;
      z-index: 10;
      cursor: pointer;
    }

    .ar-controls {
      position: absolute;
      bottom: calc(35px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.75);
      padding: 12px 24px;
      border-radius: 40px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(212, 175, 55, 0.4);
    }

    .btn-capture {
      background-color: #d4af37;
      color: #000;
      border: none;
      padding: 12px 24px;
      border-radius: 25px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <div class="header">
    <a href="index.html" class="btn-back">⬅ Accueil</a>
    <h1 id="parcours-title" class="title">Chargement...</h1>
  </div>

  <div id="map"></div>

  <div id="ar-overlay">
    <button class="btn-close-ar" onclick="fermerExperience()">❌ Fermer</button>
    
    <video id="webcam-feed" playsinline autoplay muted></video>
    <canvas id="ar-canvas"></canvas>

    <div class="ar-controls">
      <button class="btn-capture" id="btn-main" onclick="telechargerPhoto()">📸 Enregistrer la Photo</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const parcoursId = urlParams.get('id');

    let videoElement = document.getElementById('webcam-feed');
    let canvasElement = document.getElementById('ar-canvas');
    let ctx = canvasElement.getContext('2d');
    
    let cameraStream = null;
    let selfieSegmentation = null;
    let fondEpoche = new Image();
    let isProcessing = false;

    // Canvas temporaire pour le détourage
    const personCanvas = document.createElement('canvas');
    const pCtx = personCanvas.getContext('2d');

    if (!parcoursId) {
      document.getElementById('parcours-title').textContent = "Parcours introuvable";
    } else {
      fetch(`parcours-${parcoursId}.json`)
        .then(res => res.json())
        .then(data => {
          document.getElementById('parcours-title').textContent = data.titre;
          initialiserCarte(data.points);
        })
        .catch(() => {
          document.getElementById('parcours-title').textContent = "Erreur de chargement";
        });
    }

    function initialiserCarte(points) {
      if (!points || points.length === 0) return;

      const map = L.map('map').setView([points[0].lat, points[0].lng], 14);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      }).addTo(map);

      points.forEach(pt => {
        const titreAnim = pt.titre_animation || pt.nom;
        const contenuPopup = `
          <div class="popup-content">
            <b>${pt.nom}</b><br>
            <p style="margin: 4px 0; font-size: 0.85rem;">${titreAnim}</p>
            <button class="btn-ar" onclick="lancerExperience('${pt.video}')">🚀 Entrer dans l'époque</button>
          </div>
        `;

        L.marker([pt.lat, pt.lng]).addTo(map).bindPopup(contenuPopup);
      });
    }

    async function lancerExperience(mediaUrl) {
      const arOverlay = document.getElementById('ar-overlay');
      arOverlay.style.display = 'block';

      // Chargement du fond (image/cadre d'époque)
      fondEpoche.crossOrigin = "anonymous";
      fondEpoche.src = mediaUrl;

      // Initialisation de MediaPipe Selfie Segmentation
      if (!selfieSegmentation) {
        selfieSegmentation = new SelfieSegmentation({
          locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
        });

        selfieSegmentation.setOptions({
          modelSelection: 1, // 1 pour modèle complet (haute qualité), 0 pour paysage
          selfieMode: true   // Effet miroir
        });

        selfieSegmentation.onResults(onResults);
      }

      // Demande d'accès à la caméra
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        videoElement.srcObject = cameraStream;
        await videoElement.play();

        isProcessing = true;
        processVideo();
      } catch (err) {
        alert("Impossible d'accéder à la caméra : " + err.message);
      }
    }

    async function processVideo() {
      if (!isProcessing) return;
      if (videoElement.readyState >= 2) {
        await selfieSegmentation.send({ image: videoElement });
      }
      requestAnimationFrame(processVideo);
    }

    function onResults(results) {
      const w = results.image.width;
      const h = results.image.height;

      canvasElement.width = personCanvas.width = w;
      canvasElement.height = personCanvas.height = h;

      // 1. Découpage propre de l'utilisateur
      pCtx.save();
      pCtx.clearRect(0, 0, w, h);
      pCtx.drawImage(results.image, 0, 0, w, h);
      pCtx.globalCompositeOperation = 'destination-in';
      pCtx.filter = 'blur(4px)'; // Adoucit les bords du masque
      pCtx.drawImage(results.segmentationMask, 0, 0, w, h);
      pCtx.restore();

      // 2. Composition finale sur le canvas principal
      ctx.clearRect(0, 0, w, h);

      // Dessiner le fond d'époque
      if (fondEpoche.complete && fondEpoche.naturalWidth !== 0) {
        ctx.drawImage(fondEpoche, 0, 0, w, h);
      } else {
        ctx.fillStyle = "#111";
        ctx.fillRect(0, 0, w, h);
      }

      // Superposer l'utilisateur détouré
      ctx.drawImage(personCanvas, 0, 0, w, h);
    }

    function fermerExperience() {
      isProcessing = false;
      const arOverlay = document.getElementById('ar-overlay');
      
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }
      arOverlay.style.display = 'none';
    }

    function telechargerPhoto() {
      canvasElement.toBlob(async (blob) => {
        if (!blob) return;
        const file = new File([blob], `mueseum-photo-${Date.now()}.png`, { type: 'image/png' });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({
              files: [file],
              title: 'Souvenir MUE.SÉUM',
              text: 'Regarde ma photo dans le temps !'
            });
          } catch (e) {}
        } else {
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = `mueseum-souvenir.png`;
          a.click();
        }
      }, 'image/png');
    }
  </script>
</body>
</html>
